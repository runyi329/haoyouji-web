<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统升级中 - 好友记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: spin 2s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #A80000;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .refresh-btn {
      margin-top: 28px;
      display: inline-block;
      padding: 12px 32px;
      background: #A80000;
      color: white;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    .refresh-btn:hover { background: #8a0000; }
  </style>
  <script>
    // 每5秒自动刷新，检查服务是否恢复
    setTimeout(function() { window.location.reload(); }, 5000);
  </script>
</head>
<body>
  <div class="container">
    <div class="icon">⚙️</div>
    <h1>系统升级中</h1>
    <p>好友记正在进行版本更新，预计需要 1-2 分钟。</p>
    <p>页面将自动刷新，请稍候...</p>
    <button class="refresh-btn" onclick="window.location.reload()">立即刷新</button>
  </div>
</body>
</html>
