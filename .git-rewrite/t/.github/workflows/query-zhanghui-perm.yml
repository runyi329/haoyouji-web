name: 查询zhanghui权限
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查询数据库
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== zhanghui用户在所有账本中的权限设置 ==="
            mysql -u root -pMiao@20190603 crm_db -e "
              SELECT u.username, u.id as userId, lm.ledgerId, lm.role, lm.permission_delete, lm.permission_view, lm.permission_add, lm.permission_edit
              FROM ledger_members lm
              JOIN users u ON u.id = lm.userId
              WHERE u.username LIKE '%zhang%' OR u.username LIKE '%hui%' OR u.username = 'zhanghui'
              ORDER BY u.username, lm.ledgerId;
            "
            echo "=== permission_delete字段的实际类型 ==="
            mysql -u root -pMiao@20190603 crm_db -e "
              SHOW COLUMNS FROM ledger_members LIKE 'permission_delete';
            "
          ENDSSH
