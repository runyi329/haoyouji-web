name: zz-dispatch-email
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: ssh-setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: exec
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            echo "=== 查询有邮箱的用户 ==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT id, name, email FROM users WHERE email IS NOT NULL AND email != '' LIMIT 10;"
            echo "=== 查询funder_asset_orders ==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT o.id, o.coin, o.buy_value, u.name, u.email FROM funder_asset_orders o JOIN users u ON o.user_id = u.id WHERE u.email IS NOT NULL LIMIT 5;"
          EOF
