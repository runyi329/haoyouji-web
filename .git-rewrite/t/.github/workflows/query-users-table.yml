name: 查询users表结构和yunting用户
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查询数据库
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== users表字段 ==="
            mysql -u root -pMiao@20190603 crm_db -e "SHOW COLUMNS FROM users;"
            echo "=== 搜索yunting用户 ==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT id, openId, name, email, phone, company FROM users WHERE name LIKE '%yunting%' OR name LIKE '%云庭%' OR name LIKE '%Yunting%' LIMIT 10;"
            echo "=== 最近登录用户 ==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT id, openId, name, email, phone FROM users ORDER BY lastSignedIn DESC LIMIT 10;"
          ENDSSH
