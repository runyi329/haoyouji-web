name: 查询用户4957150提现记录

on:
  push:
    paths:
      - '.github/workflows/query-user4957150-withdraw.yml'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔍 查询用户4957150所有相关数据
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
            source /root/haoyouji-web/.env 2>/dev/null || true
            DB_HOST=$(echo ${DATABASE_URL:-} | grep -oP "(?<=@)[^:/]+" || echo "")
            DB_PORT=$(echo ${DATABASE_URL:-} | grep -oP "(?<=:)[0-9]{4,5}(?=/)" | tail -1 || echo "4000")
            DB_USER=$(echo ${DATABASE_URL:-} | grep -oP "(?<=://)[^:]+" || echo "")
            DB_PASS=$(echo ${DATABASE_URL:-} | grep -oP "(?<=://[^:]+:)[^@]+" || echo "")
            DB_NAME=$(echo ${DATABASE_URL:-} | grep -oP "(?<=/)[^?]+$" || echo "")

            echo "=== snt_withdrawals 中用户4957150的所有记录 ==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT id, user_id, ledger_id, snt_amount, LEFT(bsc_address,20) as addr, status, created_at FROM snt_withdrawals WHERE user_id = 4957150 ORDER BY id DESC LIMIT 10;" 2>&1

            echo "=== af_manual_balances 中用户4957150最近20条记录 ==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT id, ledger_id, user_id, amount, note, created_at FROM af_manual_balances WHERE user_id = 4957150 ORDER BY id DESC LIMIT 20;" 2>&1

            echo "=== digital_wallets 中用户4957150的钱包 ==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT id, user_id, wallet_type, network, LEFT(wallet_address,30) as addr, currency, created_at FROM digital_wallets WHERE user_id = 4957150 ORDER BY id DESC;" 2>&1

            echo "=== snt_withdrawals 最近5条（全部用户）==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT id, user_id, ledger_id, snt_amount, status, created_at FROM snt_withdrawals ORDER BY id DESC LIMIT 5;" 2>&1
          ENDSSH
