name: zz-query-sms-stats
on:
  push:
    paths:
      - '.github/workflows/zz-query-sms-stats.yml'
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: 查询腾讯云短信发送统计
        env:
          SMS_SECRET_ID: ${{ secrets.TENCENT_SMS_SECRET_ID }}
          SMS_SECRET_KEY: ${{ secrets.TENCENT_SMS_SECRET_KEY }}
        run: |
          node << 'EOF'
          const crypto = require('crypto');
          const https = require('https');

          const secretId = process.env.SMS_SECRET_ID;
          const secretKey = process.env.SMS_SECRET_KEY;
          const service = 'sms';
          const host = 'sms.tencentcloudapi.com';
          const region = 'ap-guangzhou';
          const version = '2021-01-11';

          function sign(secretKey, date, service, stringToSign) {
            const kDate = crypto.createHmac('sha256', 'TC3' + secretKey).update(date).digest();
            const kService = crypto.createHmac('sha256', kDate).update(service).digest();
            const kSigning = crypto.createHmac('sha256', kService).update('tc3_request').digest();
            return crypto.createHmac('sha256', kSigning).update(stringToSign).digest('hex');
          }

          async function callApi(action, payload) {
            const timestamp = Math.floor(Date.now() / 1000);
            const date = new Date(timestamp * 1000).toISOString().split('T')[0];
            const body = JSON.stringify(payload);
            const contentType = 'application/json; charset=utf-8';
            const canonicalHeaders = `content-type:${contentType}\nhost:${host}\n`;
            const signedHeaders = 'content-type;host';
            const hashedPayload = crypto.createHash('sha256').update(body).digest('hex');
            const canonicalRequest = `POST\n/\n\n${canonicalHeaders}\n${signedHeaders}\n${hashedPayload}`;
            const credentialScope = `${date}/${service}/tc3_request`;
            const hashedCanonical = crypto.createHash('sha256').update(canonicalRequest).digest('hex');
            const stringToSign = `TC3-HMAC-SHA256\n${timestamp}\n${credentialScope}\n${hashedCanonical}`;
            const signature = sign(secretKey, date, service, stringToSign);
            const authorization = `TC3-HMAC-SHA256 Credential=${secretId}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;

            return new Promise((resolve, reject) => {
              const options = {
                hostname: host,
                method: 'POST',
                headers: {
                  'Content-Type': contentType,
                  'Host': host,
                  'X-TC-Action': action,
                  'X-TC-Timestamp': String(timestamp),
                  'X-TC-Version': version,
                  'X-TC-Region': region,
                  'Authorization': authorization,
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            console.log('=== 查询近30天每日发送量 ===');
            const statsResult = await callApi('DescribeSmsSignList', {
              SignIdSet: [690738],
              International: 0
            });
            console.log('签名信息:', JSON.stringify(statsResult.Response, null, 2));

            // 查询发送量统计（按天）
            const sendStats = await callApi('DescribeSendSmsStatus', {
              SmsSdkAppId: '1401098628',
              Limit: 50,
              Offset: 0
            });
            console.log('\n=== 发送记录（最近50条）===');
            if (sendStats.Response && sendStats.Response.SendStatusSet) {
              const records = sendStats.Response.SendStatusSet;
              // 统计4月12日的记录
              const april12 = records.filter(r => {
                const d = new Date(r.SendTime * 1000);
                return d.getMonth() === 3 && d.getDate() === 12;
              });
              console.log('4月12日发送条数:', april12.length);
              if (april12.length > 0) {
                console.log('4月12日发送号码样本:');
                april12.slice(0, 10).forEach(r => {
                  console.log(`  ${r.PhoneNumber} | 状态:${r.ReportStatus} | 时间:${new Date(r.SendTime*1000).toLocaleString('zh-CN')}`);
                });
              }
              // 按日期统计
              const byDate = {};
              records.forEach(r => {
                const d = new Date(r.SendTime * 1000).toISOString().split('T')[0];
                byDate[d] = (byDate[d] || 0) + 1;
              });
              console.log('\n按日期统计:');
              Object.entries(byDate).sort().forEach(([d, n]) => console.log(`  ${d}: ${n}条`));
            } else {
              console.log('无发送记录或接口返回:', JSON.stringify(sendStats.Response));
            }
          }

          main().catch(console.error);
          EOF
