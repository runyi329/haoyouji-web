<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>牙伴 - 3D口腔健康</title>
    
    
    <link href="/yaban-intro/fonts/fonts.css" rel="stylesheet" />
    <link rel="preload" href="/yaban-intro/models/tooth_morph_draco.glb" as="fetch" crossorigin />
    <style>
      #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: linear-gradient(180deg, #c2e0f4 0%, #7ab8e0 40%, #4a9ad4 100%);
        transition: opacity 0.8s ease-out;
      }
      #boot-loader.fade-out { opacity: 0; pointer-events: none; }
      .loader-logo {
        width: 64px; height: 64px;
        animation: logo-bounce 1.5s ease-in-out infinite;
      }
      .loader-text {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
        font-size: 18px; font-weight: 700; color: #1a4a6e;
        letter-spacing: 4px;
        opacity: 0.8;
      }
      .loader-dots {
        display: flex; gap: 6px; margin-top: 8px;
      }
      .loader-dots span {
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255,255,255,0.7);
        animation: dot-fade 1.2s ease-in-out infinite;
      }
      .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes logo-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.05); }
      }
      @keyframes dot-fade {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
    <script type="module" crossorigin src="/yaban-intro/assets/index-C1fxY2FE.js"></script>
    <link rel="stylesheet" crossorigin href="/yaban-intro/assets/index-4nLsLi__.css">
  </head>

  <body>

    <div id="boot-loader">
      <img class="loader-logo" src="/yaban-intro/images/logo.webp" alt="牙伴" />


    </div>
    <div id="root"></div>
    <script>
      // 兑底：无论 3D / WebGL / 模型解码是否成功，超时后强制移除预加载层，避免永久卡住。
      (function () {
        var KILL_MS = 6000;
        function dismiss() {
          var el = document.getElementById('boot-loader');
          if (el && !el.classList.contains('fade-out')) {
            el.classList.add('fade-out');
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 800);
          }
        }
        setTimeout(dismiss, KILL_MS);
        // 诊断浮层：在真机上直接显示错误原因，便于定位
        function diag(msg) {
          var d = document.getElementById('yb-diag');
          if (!d) {
            d = document.createElement('div'); d.id = 'yb-diag';
            d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:100000;background:rgba(0,0,0,0.78);color:#fff;font:12px/1.5 -apple-system,sans-serif;padding:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto;';
            document.body.appendChild(d);
          }
          d.textContent += (d.textContent ? '\n' : '') + msg;
        }
        window.__ybdiag = diag;
        window.addEventListener('error', function (e) {
          diag('[error] ' + (e && e.message ? e.message : e) + (e && e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          diag('[promise] ' + (e && e.reason ? (e.reason.message || e.reason) : 'unknown'));
        });
        // WebGL 检测
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl');
          if (!gl) { diag('[webgl] 不可用，本设备/浏览器未启用 WebGL'); setTimeout(dismiss, 1500); }
          else { diag('[webgl] OK: ' + (gl.getParameter(gl.VERSION) || '')); }
        } catch (e) { diag('[webgl] 异常 ' + e.message); setTimeout(dismiss, 1500); }
        // Worker 能力检测（draco 解码依赖）
        try { if (typeof Worker === 'undefined') diag('[worker] 不可用'); } catch (e) {}
      })();
    </script>

      defer
      data-website-id="ad336437-74fb-46ff-8f97-f11e3042e439"></script>
  </body>

</html>
