<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>59号账本图标预览</title>
<style>
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    color: white;
    gap: 40px;
    margin: 0;
  }
  h2 { margin: 0; font-size: 18px; opacity: 0.8; }
  .row { display: flex; align-items: flex-end; gap: 32px; }
  .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .label { font-size: 11px; opacity: 0.5; }

  /* ===== 动画图标 ===== */
  .wave-icon {
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.4);
    background: #0d0d1a;
    position: relative;
    flex-shrink: 0;
  }
  .wave-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 波形流动动画 */
  @keyframes wave-flow {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .wave-track {
    animation: wave-flow 2.4s linear infinite;
  }
  .wave-track-2 { animation: wave-flow 2.8s linear infinite; }
  .wave-track-3 { animation: wave-flow 3.2s linear infinite; }
  .wave-track-4 { animation: wave-flow 2.0s linear infinite; }

  /* 节点脉冲 */
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.3; r: 2; }
    50%       { opacity: 1;   r: 3.5; }
  }
  .dot-1 { animation: dot-pulse 1.8s ease-in-out infinite; }
  .dot-2 { animation: dot-pulse 1.8s ease-in-out infinite 0.3s; }
  .dot-3 { animation: dot-pulse 1.8s ease-in-out infinite 0.6s; }
  .dot-4 { animation: dot-pulse 1.8s ease-in-out infinite 0.9s; }
  .dot-5 { animation: dot-pulse 1.8s ease-in-out infinite 1.2s; }
  .dot-6 { animation: dot-pulse 1.8s ease-in-out infinite 1.5s; }

  /* 模拟头部栏 */
  .header-bar {
    background: linear-gradient(135deg, #1A56DB 0%, #3B82F6 100%);
    padding: 10px 14px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 320px;
  }
  .avatar { width: 38px; height: 38px; background: rgba(255,255,255,0.3); border-radius: 50%; }
  .name { flex: 1; font-size: 14px; font-weight: 600; }
  .icon-circle { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.5); flex-shrink: 0; }
  .icon-circle img { width: 100%; height: 100%; object-fit: cover; }
  .settings-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
</style>
</head>
