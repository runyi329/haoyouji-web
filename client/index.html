<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>脉动</title>
    <link rel="icon" type="image/png" href="/maidong-hyy.png" />
    <link rel="apple-touch-icon" href="/maidong-hyy.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="脉动" />
    
    <!-- 禁用浏览器缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- 预连接优化 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    
    <!-- 字体预加载 -->
    <link rel="preload" href="https://fonts.loli.net/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDLshRTM.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- 国内CDN - Noto Serif SC (思源宋体) -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- DNS预解析 -->
    <link rel="dns-prefetch" href="https://fonts.loli.net" />
  </head>

  <body>
    <div id="root"></div>
    
    <!-- 微信环境检测和适配 -->
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isWeChat = ua.indexOf('micromessenger') > -1;
        var isWeChatMiniProgram = ua.indexOf('miniprogram') > -1 || window.__wxjs_environment === 'miniprogram';
        
        if (isWeChat || isWeChatMiniProgram) {
          // 微信环境，缩小85%
          document.documentElement.style.fontSize = '85%';
          document.body.classList.add('wechat-env');
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
