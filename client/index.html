<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>脉动</title>
    <link rel="icon" type="image/png" href="/maidong-hyy.png" />
    <link rel="apple-touch-icon" href="/maidong-hyy.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="脉动" />
    
    <!-- 禁用浏览器缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- 预连接优化 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    
    <!-- 字体预加载 -->
    <link rel="preload" href="https://fonts.loli.net/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDLshRTM.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- 国内CDN - Noto Serif SC (思源宋体) + Ma Shan Zheng (手写体) -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    
    <!-- DNS预解析 -->
    <link rel="dns-prefetch" href="https://fonts.loli.net" />
    
    <!-- Inter 字体（无斜杠零数字，接近OKXSans风格） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Oswald: 矮胖粗数字，适合时间轮盘 -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
    <!-- Barlow Condensed: OKX风格窄体数字，无中间横的E -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body style="background-color:#f4f6f8;margin:0;">
    <div id="root" style="background-color:#f4f6f8;min-height:100vh;"></div>
    
    <!-- 微信环境检测和适配 -->
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isWeChat = ua.indexOf('micromessenger') > -1;
        var isWeChatMiniProgram = ua.indexOf('miniprogram') > -1 || window.__wxjs_environment === 'miniprogram';
        
        if (isWeChat || isWeChatMiniProgram) {
          document.documentElement.style.fontSize = '85%';
          document.body.classList.add('wechat-env');
        }
      })();
    </script>
    
    <!-- 禁用Safari bfcache + 页面加载时立即同步Cookie -->
    <script>
      // 1. 注册unload事件禁用Safari的bfcache
      window.addEventListener('unload', function() {});
      
      // 2. 页面加载时立即用localStorage的token覆盖Cookie
      try {
        var token = localStorage.getItem('auth-token');
        if (token) {
          document.cookie = 'app_session_id=' + token + '; path=/; max-age=' + (365*24*60*60);
        }
      } catch(e) {}
      
      // 3. pageshow事件：从缓存(bfcache)恢复时只静默同步Cookie，不再整页重定向刷新
      //    （此前的 location.replace 会导致页面"先显示再刷新"出现闪两次/双跳，已移除）
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          try {
            var t = localStorage.getItem('auth-token');
            if (t) document.cookie = 'app_session_id=' + t + '; path=/; max-age=' + (365*24*60*60);
          } catch(ex) {}
        }
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    <!-- analytics disabled in dev
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    -->
  </body>

</html>
