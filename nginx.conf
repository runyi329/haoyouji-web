# Nginx 配置文件 - 好友记项目
# 生产位置: /etc/nginx/sites-available/haoyouji
# 部署流程会先执行 nginx -t，通过后才 reload；本文件不可绕过该校验直接上线。

# 所有明文请求统一切换到 HTTPS，避免 iPhone WebView 在 http/https 之间产生两套缓存与会话。
server {
    listen 80;
    server_name jiangyuchen.cn www.jiangyuchen.cn 124.223.54.69;
    return 301 https://jiangyuchen.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jiangyuchen.cn www.jiangyuchen.cn;

    ssl_certificate /etc/nginx/ssl/jiangyuchen.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/jiangyuchen.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/haoyouji_ssl_access.log;
    error_log /var/log/nginx/haoyouji_ssl_error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/ttf application/font-sfnt model/gltf-binary application/octet-stream application/wasm;

    # Vite 构建产物以内容哈希命名。直接由 Nginx 读取可以避开 Node 的大文件传输，
    # 且用户已成功获得一次后可在短暂网络波动时从浏览器/SW 缓存复用。
    location ^~ /assets/ {
        root /home/ubuntu/haoyouji-web/dist/public;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA 控制文件不能长期缓存；否则旧 SW 或旧 manifest 会继续控制新页面。
    location = /sw.js {
        root /home/ubuntu/haoyouji-web/dist/public;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        root /home/ubuntu/haoyouji-web/dist/public;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 首页也由应用返回，但明确禁缓存，保证发布后不会让旧入口 HTML 指向已淘汰的哈希分块。
    location = / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # API、深链接和其余业务页面继续由 Node 处理。Node 会对 HTML fallback 设置 no-store；
    # 保留既有 Upgrade 头以兼容现有 WebSocket 调用。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
