# Nginx配置文件 - 好友记项目
# 放置位置: /etc/nginx/sites-available/haoyouji
# 然后创建软链接: sudo ln -s /etc/nginx/sites-available/haoyouji /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 124.223.54.69;  # 替换为您的域名或IP

    # 日志文件
    access_log /var/log/nginx/haoyouji_access.log;
    error_log /var/log/nginx/haoyouji_error.log;

    # 代理到Node.js应用
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 转发真实IP和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓存设置
        proxy_cache_bypass $http_upgrade;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

