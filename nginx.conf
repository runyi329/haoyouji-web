# Nginx配置文件 - 好友记项目
# 放置位置: /etc/nginx/sites-available/haoyouji
# 然后创建软链接: sudo ln -s /etc/nginx/sites-available/haoyouji /etc/nginx/sites-enabled/

# upstream 配置 - 支持零停机部署时的请求重试
upstream haoyouji_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name jiangyuchen.cn www.jiangyuchen.cn 124.223.54.69;

    # 日志文件
    access_log /var/log/nginx/haoyouji_access.log;
    error_log /var/log/nginx/haoyouji_error.log;

    # 维护页面（当后端不可用时显示，而不是白屏）
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /root/haoyouji-web/public;
        internal;
    }

    # 代理到Node.js应用
    location / {
        proxy_pass http://haoyouji_backend;
        proxy_http_version 1.1;

        # 后端重启时自动重试（零停机关键配置）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 转发真实IP和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（适当延长，给pm2 reload留出时间）
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓存设置
        proxy_cache_bypass $http_upgrade;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://haoyouji_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

