<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉动网 - 工作进展看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans CJK SC', sans-serif; background-color: #fcfcfc; color: #333; }
        .timeline-line { position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #f0f0f0; }
        @media (min-width: 768px) { .timeline-line { left: 50%; margin-left: -1px; } }
        .type-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .type-feature { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
        .type-fix { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
        .type-chore { background: #f8fafc; color: #475569; border: 1px solid #f1f5f9; }
        .type-update { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }
        
        /* Calendar Heatmap Styles */
        .heatmap-cell { width: 12px; height: 12px; border-radius: 2px; transition: transform 0.2s; cursor: pointer; }
        .heatmap-cell:hover { transform: scale(1.3); outline: 1px solid #999; }
        .level-0 { background-color: #ebedf0; }
        .level-1 { background-color: #ffcccc; }
        .level-2 { background-color: #ff9999; }
        .level-3 { background-color: #ff4444; }
        .level-4 { background-color: #cc0000; }

        .tab-active { border-bottom: 3px solid #b91c1c; color: #b91c1c; font-weight: 700; }
        .scroll-mt-24 { scroll-margin-top: 6rem; }
    </style>
</head>
<body class="pb-20">
    <!-- Navigation Bar -->
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-100 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#b91c1c] rounded-lg flex items-center justify-center text-white font-bold text-xl">M</div>
                <span class="font-bold text-lg tracking-tight">脉动网 <span class="text-gray-400 font-normal">工作看板</span></span>
            </div>
            <div class="flex gap-6 text-sm font-medium text-gray-500">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="pb-1 tab-active">时间线</button>
                <button onclick="switchTab('calendar')" id="tab-calendar" class="pb-1">活跃日历</button>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 pt-8">
        <!-- Header Section -->
        <div class="bg-white rounded-2xl p-6 mb-8 border border-gray-100 shadow-sm flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">项目开发全记录</h1>
                <p class="text-gray-500 mt-1">记录每一次打磨与突破，见证从 0 到 1 的成长。</p>
            </div>
            <div class="flex gap-8 text-center">
                <div>
                    <div class="text-2xl font-bold text-[#b91c1c]" id="stat-days">0</div>
                    <div class="text-xs text-gray-400 uppercase font-bold tracking-wider">活跃天数</div>
                </div>
                <div>
                    <div class="text-2xl font-bold text-[#b91c1c]" id="stat-commits">0</div>
                    <div class="text-xs text-gray-400 uppercase font-bold tracking-wider">提交总数</div>
                </div>
            </div>
        </div>

        <!-- Calendar View (Hidden by default) -->
        <div id="view-calendar" class="hidden animate-in fade-in duration-500">
            <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-sm mb-8">
                <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-[#b91c1c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    2026 年度贡献热力图
                </h3>
                <div class="overflow-x-auto pb-4">
                    <div class="flex gap-1" id="heatmap-container">
                        <!-- Heatmap columns will be injected here -->
                    </div>
                </div>
                <div class="mt-6 flex justify-between items-center text-xs text-gray-400">
                    <div class="flex items-center gap-1">
                        <span>Less</span>
                        <div class="heatmap-cell level-0"></div>
                        <div class="heatmap-cell level-1"></div>
                        <div class="heatmap-cell level-2"></div>
                        <div class="heatmap-cell level-3"></div>
                        <div class="heatmap-cell level-4"></div>
                        <span>More</span>
                    </div>
                    <p>* 点击色块可跳转到对应日期日志</p>
                </div>
            </div>
        </div>

        <!-- Timeline View -->
        <div id="view-timeline" class="relative">
            <div class="timeline-line"></div>
            <div id="timeline-content">
                <!-- Data will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const data = []; // DATA_PLACEHOLDER

        // Initialization
        document.getElementById('stat-days').innerText = data.length;
        document.getElementById('stat-commits').innerText = data.reduce((acc, day) => acc + day.items.length, 0);

        function switchTab(tab) {
            document.getElementById('view-timeline').classList.toggle('hidden', tab !== 'timeline');
            document.getElementById('view-calendar').classList.toggle('hidden', tab !== 'calendar');
            document.getElementById('tab-timeline').classList.toggle('tab-active', tab === 'timeline');
            document.getElementById('tab-calendar').classList.toggle('tab-active', tab === 'calendar');
        }

        function scrollToDate(dateId) {
            switchTab('timeline');
            setTimeout(() => {
                const element = document.getElementById(dateId);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    element.classList.add('ring-2', 'ring-[#b91c1c]', 'ring-offset-4', 'rounded-2xl');
                    setTimeout(() => element.classList.remove('ring-2'), 2000);
                }
            }, 100);
        }

        // Render Heatmap
        const heatmapContainer = document.getElementById('heatmap-container');
        // Generate last 365 days (simplified for demo)
        const weeks = 52;
        for (let w = 0; w < weeks; w++) {
            const column = document.createElement('div');
            column.className = 'flex flex-col gap-1';
            for (let d = 0; d < 7; d++) {
                const cell = document.createElement('div');
                // Simulate data matching
                const dayOffset = (weeks - w - 1) * 7 + (6 - d);
                const date = new Date();
                date.setDate(date.getDate() - dayOffset);
                const dateStr = date.toISOString().split('T')[0];
                
                const dayData = data.find(d => d.date === dateStr);
                const count = dayData ? dayData.items.length : 0;
                let level = 0;
                if (count > 0) level = 1;
                if (count > 5) level = 2;
                if (count > 10) level = 3;
                if (count > 20) level = 4;

                cell.className = `heatmap-cell level-${level}`;
                cell.title = `${dateStr}: ${count} commits`;
                if (count > 0) {
                    cell.onclick = () => scrollToDate(`date-${dateStr}`);
                }
                column.appendChild(cell);
            }
            heatmapContainer.appendChild(column);
        }

        // Render Timeline
        const timelineContent = document.getElementById('timeline-content');
        data.forEach((day, dayIdx) => {
            const daySection = document.createElement('div');
            daySection.id = `date-${day.date}`;
            daySection.className = 'mb-16 relative scroll-mt-24 transition-all duration-500';
            
            const dateHeader = `
                <div class="flex items-center justify-center mb-10">
                    <div class="bg-white border border-gray-200 text-gray-800 px-6 py-1.5 rounded-full font-bold shadow-sm z-10 flex items-center gap-2">
                        <span class="w-2 h-2 bg-[#b91c1c] rounded-full"></span>
                        ${day.date}
                    </div>
                </div>
            `;
            
            let itemsHtml = '';
            day.items.forEach((item, itemIdx) => {
                const isLeft = itemIdx % 2 === 0;
                const alignmentClass = isLeft ? 'md:flex-row-reverse' : 'md:flex-row';
                const marginClass = isLeft ? 'md:mr-12' : 'md:ml-12';

                itemsHtml += `
                    <div class="flex items-start mb-8 relative ${alignmentClass}">
                        <div class="absolute left-[16px] md:left-1/2 md:-ml-[5px] w-2.5 h-2.5 bg-gray-300 rounded-full border-2 border-white z-20 mt-3"></div>
                        
                        <div class="flex-1 ml-10 md:ml-0 ${marginClass} bg-white p-5 rounded-2xl shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border border-gray-50 hover:border-[#b91c1c]/20 transition-all group">
                            <div class="flex items-center justify-between mb-3">
                                <span class="type-badge type-${item.type}">${item.type}</span>
                                <span class="text-[10px] text-gray-300 font-bold uppercase tracking-widest">${item.author}</span>
                            </div>
                            <p class="text-gray-700 text-[13px] leading-relaxed font-medium">${item.message}</p>
                        </div>
                        <div class="hidden md:block flex-1"></div>
                    </div>
                `;
            });

            daySection.innerHTML = dateHeader + itemsHtml;
            timelineContent.appendChild(daySection);
        });
    </script>
</body>
</html>
