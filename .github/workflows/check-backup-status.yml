name: 检查数据库备份状态
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host 124.223.54.69" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: 检查备份状态
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "===== CRONTAB ====="
            crontab -l 2>/dev/null || echo "无 crontab"
            echo ""
            echo "===== 备份目录 ====="
            ls -lht ~/database-backups/ 2>/dev/null | head -20 || echo "备份目录不存在"
            echo ""
            echo "===== 备份日志 ====="
            tail -50 ~/database-backups/backup.log 2>/dev/null || echo "无备份日志"
            echo ""
            echo "===== 磁盘空间 ====="
            df -h ~
          ENDSSH
