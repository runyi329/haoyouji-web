name: Deribit fixed public API read-only DNS diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure existing deployment SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Fixed read-only DNS and public quote probes only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'node --input-type=module -' <<'JS'
          import https from 'node:https';
          const quoteUrl = 'https://www.deribit.com/api/v2/public/get_order_book?instrument_name=ETH-25JUN27-1700-C&depth=1';
          async function probe(label, task) {
            const start=Date.now();
            try {console.log(JSON.stringify({label,...(await task()),elapsedMs:Date.now()-start}));}
            catch(e) {console.log(JSON.stringify({label,elapsedMs:Date.now()-start,error:e.message,code:e.code}));}
          }
          function get(url,address) {
            return new Promise((resolve,reject)=>{
              const options={family:4,rejectUnauthorized:true,headers:{Accept:'application/dns-json, application/json'}};
              if(address) options.lookup=(_host,_options,cb)=>cb(null,address,4);
              const request=https.get(url,options,response=>{
                let text='';
                response.on('data',b=>{text+=b;if(text.length>1000000)request.destroy(new Error('body limit'));});
                response.on('error',reject);
                response.on('end',()=>{try{resolve({http:response.statusCode,data:JSON.parse(text)});}catch{reject(new Error('non JSON response'));}});
              });
              const timer=setTimeout(()=>request.destroy(new Error('bounded 5s timeout')),5000);
              request.on('error',reject);request.on('close',()=>clearTimeout(timer));
            });
          }
          const resolvers=[
            ['alidns','https://dns.alidns.com/resolve?name=www.deribit.com&type=A'],
            ['cloudflare','https://cloudflare-dns.com/dns-query?name=www.deribit.com&type=A'],
            ['google','https://dns.google/resolve?name=www.deribit.com&type=A'],
            ['cloudflare_secondary','https://1.0.0.1/dns-query?name=www.deribit.com&type=A'],
          ];
          for(const [name,url] of resolvers) {
            await probe('doh_'+name,async()=>{
              const response=await get(url);
              const addresses=response.data.Answer?.filter(r=>r.type===1).map(r=>r.data)||[];
              return {http:response.http,status:response.data.Status,answers:response.data.Answer,addresses};
            });
            if(name==='alidns') {
              await probe('alidns_resolved_official_quote',async()=>{
                const response=await get(url);
                const address=response.data.Answer?.find(r=>r.type===1)?.data;
                if(!address)throw new Error('no IPv4 address');
                const q=await get(quoteUrl,address);const r=q.data.result;
                return {address,http:q.http,instrument:r?.instrument_name,mark:r?.mark_price,index:r?.index_price,timestamp:r?.timestamp};
              });
            }
          }
          JS
