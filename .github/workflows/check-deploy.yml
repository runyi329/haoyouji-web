name: PM2 reboot readonly diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Read PM2 startup and listener configuration without changing services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-124.223.54.69}"
          PORT="${DEPLOY_PORT:-22}"
          USER="${DEPLOY_USER:-root}"
          case "$HOST" in
            124.223.54.69|jiangyuchen.cn|www.jiangyuchen.cn) ;;
            *) echo 'Configured server is outside the authorized target.' >&2; exit 1 ;;
          esac
          test -n "$DEPLOY_SSH_KEY"
          KEY="$(mktemp)"
          KNOWN="$(mktemp)"
          trap 'rm -f "$KEY" "$KNOWN"' EXIT
          chmod 600 "$KEY" "$KNOWN"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          ssh-keyscan -T 10 -p "$PORT" "$HOST" > "$KNOWN" 2>/dev/null
          test -s "$KNOWN"
          echo 'Starting read-only diagnosis; no deploy, process restart, database write, or configuration change.'
          timeout 150 ssh -T -i "$KEY" -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" \
            "$USER@$HOST" \
            'if [ "$(id -u)" = 0 ]; then python3 -; else sudo -n python3 -; fi' \
            < scripts/diagnose-pm2-boot-readonly.py
          echo 'Read-only diagnosis completed.'
