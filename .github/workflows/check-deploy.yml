name: Deribit dynamic bootstrap read-only production preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
      - name: Dynamically resolve and validate official TLS bootstrap
        run: |
          node scripts/create-deribit-dns-bootstrap.mjs /tmp/deribit-preflight-bootstrap.json
          test -s /tmp/deribit-preflight-bootstrap.json
          printf 'DERIBIT_PREFLIGHT_BOOTSTRAP=%s\n' "$(cat /tmp/deribit-preflight-bootstrap.json)" >> "$GITHUB_ENV"
      - name: Configure existing deployment SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Only fixed public option and directory GETs without production file writes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          { cat scripts/deribit-public-transport-preflight.mjs; printf '\n'; } | \
            ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" "DERIBIT_PREFLIGHT_BOOTSTRAP='$DERIBIT_PREFLIGHT_BOOTSTRAP' node --input-type=module -"
