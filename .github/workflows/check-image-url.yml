name: 检查图片URL
on:
  workflow_dispatch:
jobs:
  check:
    name: 查询图片URL
    runs-on: ubuntu-latest
    steps:
      - name: SSH检查
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /root/haoyouji-web
            source .env 2>/dev/null || true
            node -e "
              const mysql = require('mysql2/promise');
              async function main() {
                const url = process.env.DATABASE_URL || '';
                const conn = await mysql.createConnection(url);
                const [rows] = await conn.execute('SELECT imageUrl FROM ledger_records WHERE imageUrl IS NOT NULL AND imageUrl != \"\" AND ledgerId = 76 ORDER BY createdAt DESC LIMIT 3');
                console.log('图片URLs:', JSON.stringify(rows));
                await conn.end();
              }
              main().catch(e => console.error(e.message));
            "
