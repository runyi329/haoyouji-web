name: 部署数据库备份脚本
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
      - name: 生成并上传备份脚本
        run: |
          cat > /tmp/backup-local.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          # 颜色输出
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          
          SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          BACKUP_DIR="$HOME/database-backups"
          KEEP_DAYS=60
          LOG_FILE="$BACKUP_DIR/backup.log"
          ENV_FILE="$SCRIPT_DIR/.env"
          
          DATABASE_URL=$(grep "^DATABASE_URL=" "$ENV_FILE" | cut -d '=' -f2- | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
          COS_SECRET_ID=$(grep "^COS_SECRET_ID=" "$ENV_FILE" | cut -d '=' -f2- | tr -d '"')
          COS_SECRET_KEY=$(grep "^COS_SECRET_KEY=" "$ENV_FILE" | cut -d '=' -f2- | tr -d '"')
          COS_BUCKET=$(grep "^COS_BUCKET=" "$ENV_FILE" | cut -d '=' -f2- | tr -d '"')
          COS_REGION=$(grep "^COS_REGION=" "$ENV_FILE" | cut -d '=' -f2- | tr -d '"')
          
          TEMP_URL="${DATABASE_URL#mysql://}"
          DB_USER="${TEMP_URL%%:*}"
          TEMP_URL="${TEMP_URL#*:}"
          DB_NAME="${TEMP_URL##*/}"
          DB_NAME="${DB_NAME%%\?*}"
          TEMP_URL="${TEMP_URL%/*}"
          DB_PORT="${TEMP_URL##*:}"
          TEMP_URL="${TEMP_URL%:*}"
          DB_HOST="${TEMP_URL##*@}"
          DB_PASS="${TEMP_URL%@*}"
          
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="$BACKUP_DIR/haoyouji_backup_$TIMESTAMP.sql"
          BACKUP_FILE_GZ="$BACKUP_FILE.gz"
          
          mkdir -p "$BACKUP_DIR"
          
          log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"
          }
          
          log "开始备份数据库: $DB_NAME"
          
          if mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASS" \
              --set-gtid-purged=OFF --column-statistics=0 \
              --single-transaction --routines --triggers --events \
              "$DB_NAME" > "$BACKUP_FILE"; then
              
              gzip -f "$BACKUP_FILE"
              FILE_SIZE=$(du -h "$BACKUP_FILE_GZ" | cut -f1)
              log "本地备份成功: $(basename $BACKUP_FILE_GZ) (大小: $FILE_SIZE)"
              
              if [ -n "$COS_SECRET_ID" ] && [ -n "$COS_SECRET_KEY" ]; then
                  log "开始上传到COS: $COS_BUCKET"
                  
                  # 确保环境变量里有python和pip
                  export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
                  
                  if ! command -v coscmd &> /dev/null; then
                      log "安装 coscmd..."
                      pip3 install coscmd --break-system-packages -q || true
                  fi
                  
                  # 查找 coscmd 路径
                  COSCMD_PATH=$(which coscmd || find /usr -name coscmd -type f 2>/dev/null | head -1 || find /root/.local/bin -name coscmd -type f 2>/dev/null | head -1 || echo "coscmd")
                  log "coscmd 路径: $COSCMD_PATH"
                  
                  $COSCMD_PATH config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" > /dev/null 2>&1
                  
                  if $COSCMD_PATH upload "$BACKUP_FILE_GZ" "/database-backups/$(basename $BACKUP_FILE_GZ)" > /dev/null 2>&1; then
                      log "COS上传成功"
                  else
                      log "COS上传失败"
                  fi
              fi
          else
              log "备份失败"
              exit 1
          fi
          
          log "清理${KEEP_DAYS}天前的本地备份..."
          OLD_BACKUPS=$(find "$BACKUP_DIR" -name "haoyouji_backup_*.sql.gz" -mtime +$KEEP_DAYS)
          if [ -n "$OLD_BACKUPS" ]; then
              for old_file in $OLD_BACKUPS; do
                  rm -f "$old_file"
                  log "已删除本地旧备份: $(basename $old_file)"
              done
          fi
          
          if [ -n "$COS_SECRET_ID" ]; then
              if date -v-60d >/dev/null 2>&1; then
                  CUTOFF_DATE=$(date -v-${KEEP_DAYS}d +"%Y%m%d")
              else
                  CUTOFF_DATE=$(date -d "${KEEP_DAYS} days ago" +"%Y%m%d")
              fi
              
              log "清理COS上 ${CUTOFF_DATE} 之前的备份..."
              COS_FILES=$($COSCMD_PATH list /database-backups/ | grep "haoyouji_backup_" | awk '{print $NF}')
              for cos_file in $COS_FILES; do
                  FILE_DATE=$(echo "$cos_file" | grep -o "202[0-9][0-9][0-9][0-9][0-9]")
                  if [ -n "$FILE_DATE" ] && [ "$FILE_DATE" -lt "$CUTOFF_DATE" ]; then
                      $COSCMD_PATH delete "/database-backups/$cos_file" -f > /dev/null 2>&1
                      log "已删除COS旧备份: $cos_file"
                  fi
              done
          fi
          
          log "备份任务完成"
          SCRIPT
          
          chmod +x /tmp/backup-local.sh
          scp -i ~/.ssh/id_rsa -P ${{ secrets.DEPLOY_PORT }} /tmp/backup-local.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/haoyouji-web/backup-local.sh
          
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '/root/haoyouji-web/backup-local.sh'
