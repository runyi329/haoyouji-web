name: 重建涨停聚集效应统计数据

on:
  push:
    paths:
      - '.github/workflows/rebuild-bunching-stats.yml'
      - 'scripts/rebuild-bunching-stats.py'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 在服务器上运行重建脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 7200s
          command_timeout: 7200s
          script: |
            set -e
            echo "=== 开始重建 ts_bunching_stats ==="
            pip3 install pymysql requests -q 2>/dev/null || true
            
            # 将脚本复制到服务器
            cat > /tmp/rebuild-bunching-stats.py << 'PYEOF'
#!/usr/bin/env python3
import pymysql, requests, json, time
from datetime import datetime, timedelta
from collections import defaultdict

TUSHARE_TOKEN = '5762b219a162bab92c913a2281663934b2e20e5e02c07ce7e42dfd79'
TUSHARE_URL = 'http://api.tushare.pro'
DB_CONFIG = {
    'host': '127.0.0.1', 'port': 3306,
    'user': 'root', 'password': 'Miao@20190603',
    'database': 'crm_db', 'charset': 'utf8mb4',
}
MARKETS = {
    'all':  lambda c: True,
    'SH':   lambda c: c.startswith('6') and not c.startswith('688'),
    'SZ':   lambda c: c.startswith('0'),
    'GEM':  lambda c: c.startswith('3'),
    'STAR': lambda c: c.startswith('688'),
}

def ts_call(api, params, fields):
    for _ in range(3):
        try:
            r = requests.post(TUSHARE_URL, json={'api_name':api,'token':TUSHARE_TOKEN,'params':params,'fields':fields}, timeout=30)
            d = r.json()
            if d.get('code') == 0: return d['data']
            print(f"  API error: {d.get('msg')}")
        except Exception as e:
            print(f"  Error: {e}")
        time.sleep(2)
    return None

def ensure_table(conn):
    cur = conn.cursor()
    cur.execute("""
        CREATE TABLE IF NOT EXISTS ts_bunching_stats (
            id INT AUTO_INCREMENT PRIMARY KEY,
            trade_date VARCHAR(8) NOT NULL,
            market VARCHAR(10) NOT NULL,
            total_count INT NOT NULL DEFAULT 0,
            buckets_json TEXT NOT NULL,
            at10 INT NOT NULL DEFAULT 0,
            near10 INT NOT NULL DEFAULT 0,
            at_minus10 INT NOT NULL DEFAULT 0,
            near_minus10 INT NOT NULL DEFAULT 0,
            up_bunch_ratio FLOAT NOT NULL DEFAULT 0,
            down_bunch_ratio FLOAT NOT NULL DEFAULT 0,
            UNIQUE KEY uk_date_market (trade_date, market)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
    """)
    conn.commit(); cur.close()
    print("表已就绪")

def compute(items, fi, mfn):
    bc = defaultdict(int); total = 0
    for item in items:
        code = item[fi['ts_code']].split('.')[0]
        if not mfn(code): continue
        pct = item[fi.get('pct_chg', -1)]
        if pct is None: continue
        pct = float(pct)
        if pct < -11 or pct > 11: continue
        b = round(pct * 2) / 2
        bc[b] += 1; total += 1
    buckets = []
    v = -11.0
    while v <= 11.01:
        bv = round(v * 2) / 2
        buckets.append({'bucket': bv, 'count': bc.get(bv, 0)})
        v += 0.5
    at10 = bc.get(10.0, 0); near10 = bc.get(9.5, 0)
    am10 = bc.get(-10.0, 0); nm10 = bc.get(-9.5, 0)
    return {
        'total': total, 'buckets': buckets,
        'at10': at10, 'near10': near10, 'am10': am10, 'nm10': nm10,
        'ubr': round(at10/near10, 2) if near10 > 0 else 0,
        'dbr': round(am10/nm10, 2) if nm10 > 0 else 0,
    }

def main():
    conn = pymysql.connect(**DB_CONFIG)
    ensure_table(conn)
    cur = conn.cursor()
    cur.execute("SELECT MAX(trade_date) FROM ts_bunching_stats WHERE market='all'")
    latest = cur.fetchone()[0] or '19900101'
    cur.close()
    today = datetime.now().strftime('%Y%m%d')
    print(f"已有: {latest}, 今天: {today}")
    if latest >= today:
        print("已最新"); conn.close(); return
    next_d = (datetime.strptime(latest, '%Y%m%d') + timedelta(days=1)).strftime('%Y%m%d')
    cal = ts_call('trade_cal', {'exchange':'SSE','start_date':next_d,'end_date':today,'is_open':'1'}, 'cal_date')
    if not cal: print("获取日历失败"); conn.close(); return
    fi2 = cal['fields'].index('cal_date')
    dates = sorted([r[fi2] for r in cal['items'] if r[fi2] < today])
    print(f"需处理 {len(dates)} 个交易日")
    ok = 0
    for i, td in enumerate(dates):
        print(f"[{i+1}/{len(dates)}] {td}", end=' ')
        d = ts_call('daily', {'trade_date': td}, 'ts_code,trade_date,pct_chg')
        if not d or not d['items']:
            print("无数据"); continue
        fi = {f:j for j,f in enumerate(d['fields'])}
        items = d['items']
        cur = conn.cursor()
        for mkt, mfn in MARKETS.items():
            s = compute(items, fi, mfn)
            cur.execute("""
                INSERT INTO ts_bunching_stats (trade_date,market,total_count,buckets_json,at10,near10,at_minus10,near_minus10,up_bunch_ratio,down_bunch_ratio)
                VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)
                ON DUPLICATE KEY UPDATE total_count=VALUES(total_count),buckets_json=VALUES(buckets_json),at10=VALUES(at10),near10=VALUES(near10),at_minus10=VALUES(at_minus10),near_minus10=VALUES(near_minus10),up_bunch_ratio=VALUES(up_bunch_ratio),down_bunch_ratio=VALUES(down_bunch_ratio)
            """, (td,mkt,s['total'],json.dumps(s['buckets']),s['at10'],s['near10'],s['am10'],s['nm10'],s['ubr'],s['dbr']))
        conn.commit(); cur.close()
        print(f"OK ({len(items)} 条)"); ok += 1
        time.sleep(0.4)
    conn.close()
    print(f"=== 完成: {ok}/{len(dates)} ===")

main()
PYEOF
            
            python3 /tmp/rebuild-bunching-stats.py
            echo "=== 脚本执行完毕 ==="
