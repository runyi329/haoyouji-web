name: 手动补全数字币K线数据（BTC/ETH/SOL）
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '手动补全数字币历史数据'

jobs:
  backfill:
    name: 补全 BTC/ETH/SOL 日线数据
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔄 在服务器本机触发数据补全
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== 触发数字币数据补全 ==="
            # 通过本机 curl 调用内部接口（服务运行在3000端口）
            result=$(curl -s -X POST http://127.0.0.1:3000/api/internal/sync-crypto \
              -H "Content-Type: application/json" \
              --max-time 120)
            echo "补全结果: $result"
            echo "=== 完成 ==="
          ENDSSH
