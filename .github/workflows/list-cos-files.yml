name: 列出COS文件
on:
  workflow_dispatch:
jobs:
  list:
    name: 列出COS文件
    runs-on: ubuntu-latest
    steps:
      - name: SSH列出文件
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /root/haoyouji-web
            node -e "
              require('dotenv').config();
              const COS = require('cos-nodejs-sdk-v5');
              const cos = new COS({ SecretId: process.env.COS_SECRET_ID, SecretKey: process.env.COS_SECRET_KEY });
              cos.getBucket({ Bucket: process.env.COS_BUCKET || 'haoyouji-images-1396946788', Region: 'ap-shanghai', Prefix: 'ledger-photos/', MaxKeys: 5 }, (err, data) => {
                if (err) { console.log('Error:', err.message); return; }
                console.log('文件列表:');
                data.Contents.forEach(f => console.log(f.Key));
              });
            "
