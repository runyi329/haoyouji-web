name: 调试 AI数据库接口错误

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传诊断脚本并运行
        run: |
          scp -P ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            scripts/tushare/deep_debug.py \
            scripts/tushare/PyMySQL-1.1.1-py3-none-any.whl \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/

          ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            pip3 install /root/PyMySQL-1.1.1-py3-none-any.whl --break-system-packages 2>/dev/null || true
            python3 /root/deep_debug.py

            echo ""
            echo "=== 10. 测试本地API ==="
            curl -s "http://localhost:3000/api/trpc/aiDashboardMarketCount?input=%7B%22json%22%3Anull%7D" \
              --max-time 30 2>&1 | head -500
            echo ""
            echo "=== API测试完成 ==="
          EOF
