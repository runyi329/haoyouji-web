name: 调试ctx.user.email
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查询数据库
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== users表中email字段的实际数据（前10条）==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT id, name, email, openId FROM users WHERE email IS NOT NULL AND email != '' LIMIT 10;"
            echo "=== auth相关代码中getUserById的SELECT字段 ==="
            grep -n "SELECT\|email\|phone" /root/haoyouji-web/server/db.ts | grep -i "getUserById\|select.*from.*users\|email\|phone" | head -20
            echo "=== context.ts中authenticateRequest如何查user ==="
            grep -n "email\|phone\|getUserById\|SELECT" /root/haoyouji-web/server/_core/context.ts | head -20
          ENDSSH
