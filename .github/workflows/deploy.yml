name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动重启服务'

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web
            echo "📥 拉取最新代码..."
            git fetch origin && git reset --hard origin/main && git clean -fd
            echo "🧹 清除 Vite 缓存（保留旧 dist 继续服务）..."
            rm -rf node_modules/.vite client/.vite
            echo "📦 安装依赖..."
            pnpm install
            echo "🔨 构建项目（旧 dist 在整个构建期间保持可用）..."
            pnpm run build || { echo "❌ 构建失败，保留旧版本继续运行"; exit 1; }
            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            echo "📊 执行数据库结构更新..."
            bash scripts/db-migrations.sh || true
            echo "💳 注入支付宝环境变量..."
            node /root/haoyouji-web/scripts/inject-alipay-env.cjs
            echo "🔄 删除root PM2进程（释放3000端口）..."
            pm2 delete haoyouji-web 2>/dev/null || true
            pm2 save 2>/dev/null || true
            sleep 2
            echo "🔄 同步新代码到实际服务目录..."
            cp -r /root/haoyouji-web/dist/. /home/ubuntu/haoyouji-web/dist/
            cp /root/haoyouji-web/package.json /home/ubuntu/haoyouji-web/package.json
            cp /root/haoyouji-web/pnpm-lock.yaml /home/ubuntu/haoyouji-web/pnpm-lock.yaml
            chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist
            echo "🔄 同步node_modules..."
            rsync -a --delete /root/haoyouji-web/node_modules/ /home/ubuntu/haoyouji-web/node_modules/
            chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules
            echo "🔄 重启实际服务进程..."
            # 同步.env文件到ubuntu目录（ubuntu用户没有/root/目录权限）
            cp /root/haoyouji-web/.env /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            # 复制ecosystem.config.cjs并替换cwd为ubuntu用户路径
            sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' /root/haoyouji-web/ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs
            # 用restart+update-env确保环境变量生效，不删除进程避免服务中断
            if sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 describe haoyouji-web > /dev/null 2>&1'; then
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 restart /home/ubuntu/haoyouji-web/ecosystem.config.cjs --update-env' 2>&1
            else
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs' 2>&1
            fi
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 save' 2>&1
            sleep 8
            echo "当前监听端口："
            ss -tlnp | grep ':3000\|:3001\|:8080' || echo '暂无3000/3001/8080端口监听'
            echo "ubuntu PM2进程状态："
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 list' 2>&1
            echo "ubuntu PM2错误日志（最后30行）："
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 logs haoyouji-web --err --nostream --lines 30' 2>&1 || true
            echo "✅ 部署完成！"
            echo "🔒 同步Nginx配置并重载Nginx..."
            cp /root/haoyouji-web/nginx.conf /etc/nginx/sites-available/haoyouji
            nginx -t && systemctl reload nginx
            echo "✅ Nginx配置已同步并重载"
            echo "Nginx错误日志（最后10行）："
            tail -10 /var/log/nginx/haoyouji_error.log 2>/dev/null || true
            tail -10 /var/log/nginx/error.log 2>/dev/null || true
            echo "📊 导入/更新黄金历史日K线数据..."
            cd /root/haoyouji-web && node scripts/update-gold-daily.mjs || echo "⚠️ 黄金数据更新失败（非致命）"
            echo "📊 初始化/更新数字币价格缓存..."
            cd /root/haoyouji-web && node scripts/seed-crypto-prices.mjs || echo "⚠️ 数字币价格初始化失败（非致命）"
            # 首次部署时检查数据量，不足100条则全量导入
            source /root/haoyouji-web/.env 2>/dev/null || true
            DB_HOST=$(echo ${DATABASE_URL:-} | grep -oP '(?<=@)[^:/]+' || echo '')
            DB_PORT=$(echo ${DATABASE_URL:-} | grep -oP '(?<=:)[0-9]{4,5}(?=/)' | tail -1 || echo '4000')
            DB_USER=$(echo ${DATABASE_URL:-} | grep -oP '(?<=://)[^:]+' || echo '')
            DB_PASS=$(echo ${DATABASE_URL:-} | grep -oP '(?<=://[^:]+:)[^@]+' || echo '')
            DB_NAME=$(echo ${DATABASE_URL:-} | grep -oP '(?<=/)[^?]+$' || echo '')
            if [ -n "$DB_HOST" ]; then
              GOLD_COUNT=$(mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -sN -e "SELECT COUNT(*) FROM gold_daily_kline;" 2>/dev/null || echo '0')
              echo "当前黄金数据条数: $GOLD_COUNT"
              if [ "$GOLD_COUNT" -lt 100 ] 2>/dev/null; then
                echo "数据不足，执行全量导入..."
                cd /root/haoyouji-web && node scripts/import-gold-history.mjs || echo "⚠️ 全量导入失败"
              fi
            fi
            # 设置每日凌晨2点自动更新黄金数据的cron任务
            CRON_JOB="0 2 * * * cd /root/haoyouji-web && node scripts/update-gold-daily.mjs >> /var/log/gold-update.log 2>&1"
            (crontab -l 2>/dev/null | grep -v 'update-gold-daily'; echo "$CRON_JOB") | crontab -
            echo "✅ 黄金数据每日更新cron任务已设置"
            echo "📤 上传同花顺股票图标到COS..."
            cd /root/haoyouji-web && node scripts/upload-ths-icon.mjs || echo "⚠️ 图标上传失败（非致命）"
            echo "🔍 执行COS诊断..."
            bash /root/haoyouji-web/scripts/diagnose-cos.sh
            echo "=== 查询云南region数据 ==="
            source /root/haoyouji-web/.env 2>/dev/null || true
            DB_HOST=$(echo ${DATABASE_URL:-} | grep -oP '(?<=@)[^:/]+' || echo '')
            DB_PORT=$(echo ${DATABASE_URL:-} | grep -oP '(?<=:)[0-9]{4,5}(?=/)' | tail -1 || echo '4000')
            DB_USER=$(echo ${DATABASE_URL:-} | grep -oP '(?<=://)[^:]+' || echo '')
            DB_PASS=$(echo ${DATABASE_URL:-} | grep -oP '(?<=://[^:]+:)[^@]+' || echo '')
            DB_NAME=$(echo ${DATABASE_URL:-} | grep -oP '(?<=/)[^?]+$' || echo '')
            if [ -n "$DB_HOST" ]; then
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT region, COUNT(*) as cnt FROM contacts WHERE parent_user_id = (SELECT id FROM users WHERE username='jiang' LIMIT 1) AND region IS NOT NULL AND region != '' GROUP BY region ORDER BY cnt DESC LIMIT 20;" 2>&1 || echo 'mysql query failed'
            else
              echo 'DATABASE_URL not found'
            fi
          ENDSSH
      
      - name: 企业微信部署通知
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_TEXT="部署成功"
            STATUS_ICON="[成功]"
          else
            STATUS_TEXT="部署失败"
            STATUS_ICON="[失败]"
          fi
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=3-XQAnU8_8iKPA74O6_Gw3YQPdOIA2nIv4ILXpxcZ2g" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ${STATUS_ICON} 脉动网部署通知\\n> **状态**：${STATUS_TEXT}\\n> **提交**：${COMMIT_HASH}\\n> **内容**：${COMMIT_MSG}\\n> **时间**：$(date '+%Y-%m-%d %H:%M:%S')\"}}"
          echo "企业微信通知已发送"
