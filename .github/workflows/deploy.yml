name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动重启服务'

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host 124.223.54.69" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "  ServerAliveInterval 15" >> ~/.ssh/config
          echo "  ServerAliveCountMax 20" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

            echo "📂 进入项目目录..."
            cd /root/haoyouji-web

            echo "📥 拉取最新代码..."
            OLD_LOCK_HASH=$(md5sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo "none")
            git fetch origin && git reset --hard origin/main && git clean -fd
            NEW_LOCK_HASH=$(md5sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo "none")
            echo "✅ 当前 git HEAD: $(git log --oneline -1)"

            # 只在lockfile变化时重新安装依赖
            if [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
              echo "📦 lockfile已变化，重新安装依赖..."
              pnpm install --frozen-lockfile
            else
              echo "📦 依赖无变化，跳过安装"
            fi

            echo "🔨 开始构建项目..."
            export NODE_OPTIONS="--max-old-space-size=4096"
            set -o pipefail
            # 后台心跳：每10秒输出一个点，防止SSH因无输出被断开
            ( while true; do sleep 10; printf "."; done ) &
            HEARTBEAT_PID=$!
            pnpm run build 2>&1 | tee /tmp/build_output.log || { kill $HEARTBEAT_PID 2>/dev/null; echo ""; echo "❌ 构建失败！"; cat /tmp/build_output.log | tail -50; exit 1; }
            kill $HEARTBEAT_PID 2>/dev/null
            echo ""
            echo "✅ 构建完成"

            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            bash scripts/db-migrations.sh || true

            echo "🔄 同步构建产物到服务目录..."
            rm -rf /home/ubuntu/haoyouji-web/dist
            cp -rf /root/haoyouji-web/dist /home/ubuntu/haoyouji-web/dist
            mkdir -p /home/ubuntu/haoyouji-web/server
            cp /root/haoyouji-web/server/git-log.json /home/ubuntu/haoyouji-web/server/git-log.json 2>/dev/null || true
            chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/server/git-log.json 2>/dev/null || true
            cp /root/haoyouji-web/package.json /home/ubuntu/haoyouji-web/package.json
            cp /root/haoyouji-web/pnpm-lock.yaml /home/ubuntu/haoyouji-web/pnpm-lock.yaml

            # 只在lockfile变化时同步node_modules（最耗时的步骤）
            if [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
              echo "🔄 依赖已变化，同步 node_modules..."
              rsync -a --delete /root/haoyouji-web/node_modules/ /home/ubuntu/haoyouji-web/node_modules/
              chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules
            else
              echo "🔄 依赖无变化，跳过 node_modules 同步"
            fi

            echo "🔄 同步环境配置..."
            cp /root/haoyouji-web/.env /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' /root/haoyouji-web/ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs

            echo "🔄 重启服务..."
            pm2 delete haoyouji-web 2>/dev/null || true
            pm2 save 2>/dev/null || true
            if sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 describe haoyouji-web > /dev/null 2>&1'; then
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 restart /home/ubuntu/haoyouji-web/ecosystem.config.cjs --update-env' 2>&1
            else
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs' 2>&1
            fi
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 save' 2>&1
            sleep 3

            echo "🔒 同步 Nginx 配置..."
            cp /root/haoyouji-web/nginx.conf /etc/nginx/sites-available/haoyouji
            nginx -t && (systemctl reload nginx 2>/dev/null || true)

            echo "📊 服务状态检查..."
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 list' 2>&1

            echo "✅ 部署完成！"
          ENDSSH
