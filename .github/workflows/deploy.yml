name: 自动部署到生产服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web
            echo "📥 拉取最新代码..."
            git pull --rebase origin main
            echo "📦 安装依赖..."
            pnpm install
            echo "🔨 构建项目..."
            pnpm run build
            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            echo "📊 删除并重建opinion表..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "DROP TABLE IF EXISTS opinion_entries; DROP TABLE IF EXISTS opinion_tables; DROP TABLE IF EXISTS opinion_books; CREATE TABLE opinion_books (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100) NOT NULL, store_name VARCHAR(100), description TEXT, owner_id INT NOT NULL, is_active TINYINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX opinion_books_owner_idx (owner_id)); CREATE TABLE opinion_tables (id INT AUTO_INCREMENT PRIMARY KEY, book_id INT NOT NULL, table_code VARCHAR(50) NOT NULL, location VARCHAR(100), is_active TINYINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, INDEX opinion_tables_book_idx (book_id)); CREATE TABLE opinion_entries (id INT AUTO_INCREMENT PRIMARY KEY, book_id INT NOT NULL, table_id INT NOT NULL, content TEXT NOT NULL, rating TINYINT, guest_name VARCHAR(50), guest_ip VARCHAR(45), is_read TINYINT NOT NULL DEFAULT 0, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, INDEX opinion_entries_book_idx (book_id), INDEX opinion_entries_table_idx (table_id), INDEX opinion_entries_created_idx (created_at)); SHOW TABLES LIKE 'opinion%';"
            echo "✅ opinion表重建完成"
            echo "🔄 重启服务（使用 ecosystem.config.cjs 确保 COS 环境变量持久化）..."
            pm2 startOrRestart /root/haoyouji-web/ecosystem.config.cjs --env production
            pm2 save
            echo "✅ 部署完成！"
          ENDSSH
      
      - name: 📢 部署结果通知
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败，请检查日志"
          fi
