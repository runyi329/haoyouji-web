name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
    paths-ignore:
      - "backups/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因"
        required: false
        default: "手动部署"

# 同一时间只允许一个生产部署；新提交按顺序部署，避免构建与 PM2 相互覆盖。
concurrency:
  group: haoyouji-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 云端构建并同步到生产服务器
    runs-on: ubuntu-latest
    # 首次部署或网络波动时，传输重试与服务器校验仍需有足够时间完成；
    # rsync 自身有90秒无数据超时，不会再像旧流程一样无输出占满整个任务。
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      # 不再由生产机访问 GitHub。生产机遇到网络抖动时，git fetch 会长时间卡住；
      # 统一由 GitHub Actions Runner 拉取、构建，再通过 SSH 同步已验证产物。
      - name: 检出指定提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段唯一确定，避免双重声明冲突。

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装构建依赖
        run: pnpm install --frozen-lockfile

      - name: 构建生产产物
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build
          test -f dist/index.js
          test -f dist/public/index.html

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'SSHEOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 10
            ConnectTimeout 20
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: 原子发布构建产物并重启服务
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          APP_DIR=/home/ubuntu/haoyouji-web
          SSH_KEY="$HOME/.ssh/deploy_key"
          SSH_CMD="ssh -i ${SSH_KEY} -p ${DEPLOY_PORT} -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          LOCAL_LOCK_HASH=$(md5sum pnpm-lock.yaml | cut -d' ' -f1)
          REMOTE_LOCK_HASH=$(${SSH_CMD} "${REMOTE}" "md5sum ${APP_DIR}/pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || true")

          echo "部署目标提交：${EXPECTED_SHA}"
          RELEASES_DIR="${APP_DIR}/releases"
          RELEASE_DIR="${RELEASES_DIR}/${EXPECTED_SHA}"
          # 发布目录在同一块磁盘上：按校验和发现未变化文件后直接硬链接旧版。
          # 构建会重置静态文件时间戳，因此明确不保留时间戳；否则内容相同的资源
          # 仍会因mtime不同而被重新跨网传输约百兆图片、音频和模型文件。
          REMOTE_CURRENT_DIST=$(${SSH_CMD} "${REMOTE}" "readlink -f '${APP_DIR}/dist' 2>/dev/null || true")
          RSYNC_DIST_ARGS=(-azc --no-times --delete --partial --timeout=90 --human-readable --info=progress2)
          if [ -n "${REMOTE_CURRENT_DIST}" ]; then
            RSYNC_DIST_ARGS+=("--link-dest=${REMOTE_CURRENT_DIST}")
            echo "复用当前发布目录：${REMOTE_CURRENT_DIST}"
          fi

          sync_dist_with_retry() {
            local attempt status
            for attempt in 1 2 3; do
              echo "同步构建产物（第 ${attempt}/3 次）…"
              if rsync "${RSYNC_DIST_ARGS[@]}" -e "${SSH_CMD}" dist/ "${REMOTE}:${RELEASE_DIR}/"; then
                return 0
              else
                status=$?
              fi
              echo "构建产物同步中断（退出码 ${status}）；等待后重试。" >&2
              sleep $((attempt * 5))
            done
            echo "构建产物同步连续失败，未执行生产版本切换。" >&2
            return 1
          }

          echo "同步构建产物至新发布目录…"
          ${SSH_CMD} "${REMOTE}" "mkdir -p '${RELEASE_DIR}' '${APP_DIR}/server'"
          sync_dist_with_retry
          rsync -az -e "${SSH_CMD}" package.json pnpm-lock.yaml "${REMOTE}:${APP_DIR}/"
          rsync -az -e "${SSH_CMD}" server/git-log.json "${REMOTE}:${APP_DIR}/server/git-log.json"
          rsync -az -e "${SSH_CMD}" nginx.conf "${REMOTE}:${APP_DIR}/nginx.conf"

          # 只有锁文件变化时才同步 node_modules；本次锁文件未变化，不会引入大文件传输。
          if [ "${LOCAL_LOCK_HASH}" != "${REMOTE_LOCK_HASH}" ]; then
            echo "锁文件变化，同步运行依赖…"
            rsync -az --delete -e "${SSH_CMD}" node_modules/ "${REMOTE}:${APP_DIR}/node_modules/"
          else
            echo "锁文件未变化，复用生产依赖。"
          fi

          ${SSH_CMD} "${REMOTE}" "EXPECTED_SHA='${EXPECTED_SHA}' bash -s" <<'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/haoyouji-web
          RELEASES_DIR="$APP_DIR/releases"
          RELEASE_DIR="$RELEASES_DIR/$EXPECTED_SHA"
          NGINX_SITE=/etc/nginx/sites-available/haoyouji
          NGINX_ENABLED=/etc/nginx/sites-enabled/haoyouji

          test -f "$RELEASE_DIR/index.js"
          test -f "$RELEASE_DIR/public/index.html"
          # rsync 由ubuntu用户直接写入发布目录，无需对整个构建目录重复递归chown。
          chown ubuntu:ubuntu "$RELEASE_DIR" "$APP_DIR/server/git-log.json" "$APP_DIR/package.json" "$APP_DIR/pnpm-lock.yaml" "$APP_DIR/nginx.conf"
          printf '%s\n' "$EXPECTED_SHA" > "$RELEASE_DIR/.deployed-commit"
          chown ubuntu:ubuntu "$RELEASE_DIR/.deployed-commit"

          # sites-enabled 曾遗留一份独立旧文件，导致更新 sites-available 后实际路由仍未切换。
          # 每次发布都以通过校验的 sites-available 为唯一来源，并保留两份旧文件以便语法失败时原样回滚。
          if sudo test -f "$NGINX_SITE"; then
            NGINX_SITE_BACKUP="$(mktemp /tmp/haoyouji-nginx-site.XXXXXX)"
            NGINX_ENABLED_BACKUP="$(mktemp /tmp/haoyouji-nginx-enabled.XXXXXX)"
            NGINX_ENABLED_EXISTED=0
            sudo cp -a "$NGINX_SITE" "$NGINX_SITE_BACKUP"
            if sudo test -e "$NGINX_ENABLED" || sudo test -L "$NGINX_ENABLED"; then
              NGINX_ENABLED_EXISTED=1
              sudo cp -a "$NGINX_ENABLED" "$NGINX_ENABLED_BACKUP"
            fi
            sudo install -m 644 "$APP_DIR/nginx.conf" "$NGINX_SITE"
            sudo rm -f "$NGINX_ENABLED"
            sudo ln -s "$NGINX_SITE" "$NGINX_ENABLED"
            if ! sudo nginx -t; then
              echo "Nginx 配置校验失败，已恢复原站点配置和启用链接。" >&2
              sudo cp -a "$NGINX_SITE_BACKUP" "$NGINX_SITE"
              sudo rm -f "$NGINX_ENABLED"
              if [ "$NGINX_ENABLED_EXISTED" = "1" ]; then
                sudo cp -a "$NGINX_ENABLED_BACKUP" "$NGINX_ENABLED"
              fi
              sudo nginx -t || true
              rm -f "$NGINX_SITE_BACKUP" "$NGINX_ENABLED_BACKUP"
              exit 1
            fi
            sudo systemctl reload nginx
            rm -f "$NGINX_SITE_BACKUP" "$NGINX_ENABLED_BACKUP"
            echo "Nginx 静态资源配置和启用链接已安全加载。"
          else
            echo "未找到 $NGINX_SITE；未修改 Nginx 配置。"
          fi

          # 将上一版的内容哈希资源补入新目录。旧会话仍可完成已触发的懒加载，
          # 而新的 index.html 只会引用本次构建的哈希文件。
          CURRENT_DIST="$(readlink -f "$APP_DIR/dist" 2>/dev/null || true)"
          if [ -n "$CURRENT_DIST" ] && [ -d "$CURRENT_DIST/public/assets" ]; then
            # 同一文件系统内优先硬链接，避免旧哈希资源保留时再次复制大量文件；
            # 若服务器目录跨文件系统，则安全降级为普通复制。
            cp -al -n "$CURRENT_DIST/public/assets/." "$RELEASE_DIR/public/assets/" \
              || cp -a -n "$CURRENT_DIST/public/assets/." "$RELEASE_DIR/public/assets/"
          fi

          # 新构建完全同步和校验通过后才原子切换 dist 软链接。
          if [ ! -L "$APP_DIR/dist" ] && [ -d "$APP_DIR/dist" ]; then
            LEGACY_RELEASE="$RELEASES_DIR/legacy-before-$EXPECTED_SHA"
            mv "$APP_DIR/dist" "$LEGACY_RELEASE"
          fi
          rm -f "$APP_DIR/.dist-next"
          ln -s "$RELEASE_DIR" "$APP_DIR/.dist-next"
          mv -Tf "$APP_DIR/.dist-next" "$APP_DIR/dist"

          echo "重启 PM2…"
          if sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null 2>&1; then
            sudo -u ubuntu env HOME=/home/ubuntu pm2 restart "$APP_DIR/ecosystem.config.cjs" --update-env
          else
            sudo -u ubuntu env HOME=/home/ubuntu pm2 start "$APP_DIR/ecosystem.config.cjs" --update-env
          fi
          sudo -u ubuntu env HOME=/home/ubuntu pm2 save
          sleep 3
          sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null
          sudo -u ubuntu env HOME=/home/ubuntu pm2 list

          echo "校验本机服务响应…"
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null \
              || curl -fsS --max-time 5 http://127.0.0.1:3001/ >/dev/null; then
              echo "服务健康检查通过。"
              break
            fi
            sleep 2
          done
          if ! curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null \
            && ! curl -fsS --max-time 5 http://127.0.0.1:3001/ >/dev/null; then
            echo "PM2 已启动，但本机 HTTP 健康检查未通过。" >&2
            exit 1
          fi

          # 仅在本机已加载对应站点配置时检查真实 HTTPS 入口，避免只验证Node而漏掉Nginx反代。
          if sudo test -f "$NGINX_SITE"; then
            curl --fail --silent --show-error --max-time 10 \
              --resolve jiangyuchen.cn:443:127.0.0.1 \
              https://jiangyuchen.cn/ >/dev/null
            echo "Nginx HTTPS 健康检查通过。"

            ENTRY_ASSET="$(grep -oE '/assets/[^\" ]+\.js' "$RELEASE_DIR/public/index.html" | head -n 1)"
            if [ -z "$ENTRY_ASSET" ]; then
              echo "未能从当前构建入口定位静态脚本。" >&2
              exit 1
            fi
            STATIC_HEADERS="$(curl --fail --silent --show-error --head --max-time 10 \
              --resolve jiangyuchen.cn:443:127.0.0.1 \
              "https://jiangyuchen.cn$ENTRY_ASSET")"
            printf '%s\n' "$STATIC_HEADERS"
            if printf '%s\n' "$STATIC_HEADERS" | grep -qi '^x-powered-by:' \
              || ! printf '%s\n' "$STATIC_HEADERS" | grep -qi '^cache-control:.*immutable'; then
              echo "Nginx 静态资源直出校验失败：入口脚本仍经应用反代或缺少长期缓存。" >&2
              exit 1
            fi
            echo "Nginx 静态资源直出校验通过。"
          fi

          # 保留当前与最近三版，兼顾旧分块回退、回滚能力及服务器磁盘空间。
          find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | awk 'NR > 4 {print $2}' | while IFS= read -r old_release; do
                [ -n "$old_release" ] && rm -rf "$old_release"
              done
          ENDSSH
