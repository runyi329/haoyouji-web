name: 自动部署到生产服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web

            echo "📥 拉取最新代码..."
            git fetch origin && git reset --hard origin/main && git clean -fd

            echo "🧹 清除 Vite 缓存（保留旧 dist 继续服务）..."
            rm -rf node_modules/.vite client/.vite

            echo "📦 安装依赖..."
            pnpm install

            echo "🔨 构建项目（旧进程在整个构建期间保持可用）..."
            pnpm run build || { echo "❌ 构建失败，保留旧版本继续运行"; exit 1; }

            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            echo "📊 执行数据库结构更新..."
            bash scripts/db-migrations.sh || true

            echo "💳 注入支付宝环境变量..."
            node /root/haoyouji-web/scripts/inject-alipay-env.cjs

            echo "🔄 零停机热重载（pm2 reload：先起新进程再停旧进程）..."
            if pm2 describe haoyouji-web > /dev/null 2>&1; then
              pm2 reload haoyouji-web --update-env
            else
              pm2 start /root/haoyouji-web/ecosystem.config.cjs --env production
            fi
            pm2 save

            echo "⏳ 等待新进程就绪..."
            sleep 3

            echo "✅ 验证服务是否正常..."
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1 || \
                 curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ 服务已就绪"
                break
              fi
              echo "⏳ 等待服务启动... ($i/5)"
              sleep 3
            done

            echo "当前监听端口："
            ss -tlnp | grep node || echo '暂无node监听'
            echo "🔧 同步 Nginx 配置并热重载..."
            cp /root/haoyouji-web/nginx.conf /etc/nginx/sites-available/haoyouji
            # 确保软链接存在
            ln -sf /etc/nginx/sites-available/haoyouji /etc/nginx/sites-enabled/haoyouji
            # 测试配置语法
            nginx -t && nginx -s reload && echo "✅ Nginx 配置已更新" || echo "⚠️ Nginx 配置有误，跳过重载"

            echo "✅ 部署完成！"
            echo "=== 🔍 临时调试：win_status差异查询 ==="
            bash /root/haoyouji-web/scripts/debug-win-status.sh || true
            echo "=== 🔍 调试查询完成 ==="
          ENDSSH
      
      - name: 企业微信部署通知
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_TEXT="部署成功"
            STATUS_ICON="[成功]"
          else
            STATUS_TEXT="部署失败"
            STATUS_ICON="[失败]"
          fi
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=3-XQAnU8_8iKPA74O6_Gw3YQPdOIA2nIv4ILXpxcZ2g" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ${STATUS_ICON} 脉动网部署通知\\n> **状态**：${STATUS_TEXT}\\n> **提交**：${COMMIT_HASH}\\n> **内容**：${COMMIT_MSG}\\n> **时间**：$(date '+%Y-%m-%d %H:%M:%S')\"}}"
          echo "企业微信通知已发送"
