name: 自动部署到生产服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web
            echo "📥 拉取最新代码..."
            git fetch origin && git reset --hard origin/main
            echo "📦 安装依赖..."
            pnpm install
            echo "🔨 构建项目..."
            pnpm run build
            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            echo "📊 确保opinion表存在并更新结构..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              CREATE TABLE IF NOT EXISTS opinion_books (id INT AUTO_INCREMENT PRIMARY KEY, ledger_id INT DEFAULT NULL COMMENT '关联ledgers表ID', name VARCHAR(100) NOT NULL, store_name VARCHAR(100), description TEXT, owner_id INT NOT NULL, is_active TINYINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX opinion_books_owner_idx (owner_id), INDEX opinion_books_ledger_idx (ledger_id));
              CREATE TABLE IF NOT EXISTS opinion_tables (id INT AUTO_INCREMENT PRIMARY KEY, book_id INT NOT NULL, branch_name VARCHAR(100) DEFAULT NULL COMMENT '分店名称（一级标签）', table_code VARCHAR(50) NOT NULL, location VARCHAR(100), is_active TINYINT NOT NULL DEFAULT 1, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, INDEX opinion_tables_book_idx (book_id));
              CREATE TABLE IF NOT EXISTS opinion_entries (id INT AUTO_INCREMENT PRIMARY KEY, book_id INT NOT NULL, table_id INT NOT NULL, content TEXT NOT NULL, rating TINYINT, guest_name VARCHAR(50), guest_ip VARCHAR(45), is_read TINYINT NOT NULL DEFAULT 0, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, INDEX opinion_entries_book_idx (book_id), INDEX opinion_entries_table_idx (table_id), INDEX opinion_entries_created_idx (created_at));
              SHOW TABLES LIKE 'opinion%';
            "
            # 安全添加branch_name字段（如果不存在）
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='opinion_tables' AND COLUMN_NAME='branch_name';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE opinion_tables ADD COLUMN branch_name VARCHAR(100) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            # 安全添加ledger_id字段到opinion_books（如果不存在）
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='opinion_books' AND COLUMN_NAME='ledger_id';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE opinion_books ADD COLUMN ledger_id INT DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ opinion表结构更新完成"
            echo "📊 查看opinion_books当前数据..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "SELECT id, name, owner_id, created_at FROM opinion_books;"
            echo "📊 查看opinion_tables当前数据..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "SELECT id, book_id, branch_name, table_code FROM opinion_tables LIMIT 10;"
            echo "📊 确保af_orders表存在..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "CREATE TABLE IF NOT EXISTS af_orders (id INT AUTO_INCREMENT PRIMARY KEY, ledger_id INT NOT NULL, user_id INT NOT NULL, coin VARCHAR(10) NOT NULL, side VARCHAR(10) NOT NULL, limit_price VARCHAR(50) NOT NULL, amount VARCHAR(50) NOT NULL, quantity VARCHAR(50) NOT NULL, status VARCHAR(20) NOT NULL DEFAULT 'pending', order_type VARCHAR(50) NOT NULL DEFAULT '', created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX af_orders_ledger_idx (ledger_id), INDEX af_orders_user_idx (user_id), INDEX af_orders_coin_idx (coin))" || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='order_type';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN order_type VARCHAR(50) NOT NULL DEFAULT \"\"', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "📊 添加af_orders赠送订单字段..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='is_gift';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN is_gift TINYINT NOT NULL DEFAULT 0', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='gift_multiplier';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN gift_multiplier VARCHAR(10) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='source_order_id';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN source_order_id INT DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='source_user_id';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN source_user_id INT DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @idx_exists FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND INDEX_NAME='af_orders_source_idx';
              SET @sql = IF(@idx_exists = 0, 'ALTER TABLE af_orders ADD INDEX af_orders_source_idx (source_order_id)', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='original_limit_price';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN original_limit_price VARCHAR(50) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='source_amount';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN source_amount VARCHAR(50) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ af_orders赠送字段确认完成"
            echo "📊 添加af_orders卖出字段（订单合并模型）..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='sell_price';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN sell_price VARCHAR(50) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='sell_quantity';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN sell_quantity VARCHAR(50) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='sell_at';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN sell_at DATETIME DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='sell_confirmed_at';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN sell_confirmed_at DATETIME DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @col_exists FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='af_orders' AND COLUMN_NAME='sell_status';
              SET @sql = IF(@col_exists = 0, 'ALTER TABLE af_orders ADD COLUMN sell_status VARCHAR(20) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ af_orders卖出字段确认完成"
            echo "✅ af_orders表确认完成"
            echo "📊 确保af_manual_balances表存在..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "CREATE TABLE IF NOT EXISTS af_manual_balances (id INT AUTO_INCREMENT PRIMARY KEY, ledger_id INT NOT NULL, user_id INT NOT NULL, amount DECIMAL(18,2) NOT NULL DEFAULT 0, note VARCHAR(255) DEFAULT '', created_at DATETIME NOT NULL, updated_at DATETIME NOT NULL, INDEX idx_ledger (ledger_id), INDEX idx_user (user_id))" || true
            echo "✅ af_manual_balances表确认完成"
            echo "📊 确保users表新字段存在(phone/company/business/real_name)..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "ALTER TABLE users ADD COLUMN IF NOT EXISTS phone VARCHAR(20) DEFAULT NULL" || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "ALTER TABLE users ADD COLUMN IF NOT EXISTS company VARCHAR(100) DEFAULT NULL" || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "ALTER TABLE users ADD COLUMN IF NOT EXISTS business VARCHAR(200) DEFAULT NULL" || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "ALTER TABLE users ADD COLUMN IF NOT EXISTS real_name VARCHAR(50) DEFAULT NULL" || true
            echo "✅ users表新字段确认完成"
            echo "📊 确保users表邀请相关字段存在..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='users' AND COLUMN_NAME='invited_by_user_id';
              SET @s = IF(@c=0, 'ALTER TABLE users ADD COLUMN invited_by_user_id INT DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='users' AND COLUMN_NAME='invited_at';
              SET @s = IF(@c=0, 'ALTER TABLE users ADD COLUMN invited_at DATETIME DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='users' AND COLUMN_NAME='invite_count';
              SET @s = IF(@c=0, 'ALTER TABLE users ADD COLUMN invite_count INT NOT NULL DEFAULT 0', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='users' AND COLUMN_NAME='invite_enabled';
              SET @s = IF(@c=0, 'ALTER TABLE users ADD COLUMN invite_enabled TINYINT NOT NULL DEFAULT 0', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='users' AND COLUMN_NAME='invite_code';
              SET @s = IF(@c=0, 'ALTER TABLE users ADD COLUMN invite_code VARCHAR(20) DEFAULT NULL', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ users表邀请字段确认完成"
            echo "💳 确保 recharge_orders 表 ledger_id 字段存在..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='recharge_orders' AND COLUMN_NAME='ledger_id';
              SET @s = IF(@c=0, 'ALTER TABLE recharge_orders ADD COLUMN ledger_id INT DEFAULT NULL COMMENT \"\\u5173\\u8054\\u8d26\\u672cID\\uff0c\\u4e3a\\u7a7a\\u8868\\u793a\\u901a\\u7528\\u5145\\u5024\"', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @idx FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='recharge_orders' AND INDEX_NAME='recharge_orders_ledger_id_idx';
              SET @s = IF(@idx=0, 'ALTER TABLE recharge_orders ADD INDEX recharge_orders_ledger_id_idx (ledger_id)', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ recharge_orders.ledger_id 字段确认完成"
            echo "💳 将现有已完成充値记录关联到账本52(谷底增笹)..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              UPDATE recharge_orders SET ledger_id = 52 WHERE status = 'completed' AND ledger_id IS NULL;
            " || true
            echo "✅ 历史充値记录关联完成"
            echo "💳 确保 snt_withdrawals 表 ledger_id 字段存在..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='snt_withdrawals' AND COLUMN_NAME='ledger_id';
              SET @s = IF(@c=0, 'ALTER TABLE snt_withdrawals ADD COLUMN ledger_id INT DEFAULT NULL COMMENT \"\\u5173\\u8054\\u8d26\\u672cID\"', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT COUNT(*) INTO @idx FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='snt_withdrawals' AND INDEX_NAME='snt_withdrawals_ledger_id_idx';
              SET @s = IF(@idx=0, 'ALTER TABLE snt_withdrawals ADD INDEX snt_withdrawals_ledger_id_idx (ledger_id)', 'SELECT 1');
              PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            " || true
            echo "✅ snt_withdrawals.ledger_id 字段确认完成"
            echo "💳 注入支付宝环境变量..."
            node /root/haoyouji-web/scripts/inject-alipay-env.cjs
            echo "🔄 重启服务（使用 ecosystem.config.cjs 确保 COS 环境变量持久化）..."
            pm2 startOrRestart /root/haoyouji-web/ecosystem.config.cjs --env production
            pm2 save
            echo "✅ 部署完成！"
          ENDSSH
      
      - name: 📢 部署结果通知
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败，请检查日志"
          fi
