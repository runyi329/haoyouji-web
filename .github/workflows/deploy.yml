name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
    paths-ignore:
      - "backups/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因"
        required: false
        default: "手动部署"

# 同一时间只允许一个生产部署；新提交按顺序部署，避免构建与 PM2 相互覆盖。
concurrency:
  group: haoyouji-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 云端构建并同步到生产服务器
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      # 不再由生产机访问 GitHub。生产机遇到网络抖动时，git fetch 会长时间卡住；
      # 统一由 GitHub Actions Runner 拉取、构建，再通过 SSH 同步已验证产物。
      - name: 检出指定提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段唯一确定，避免双重声明冲突。

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装构建依赖
        run: pnpm install --frozen-lockfile

      - name: 构建生产产物
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build
          test -f dist/index.js
          test -f dist/public/index.html

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'SSHEOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 10
            ConnectTimeout 20
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: 同步构建产物并重启服务
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          APP_DIR=/home/ubuntu/haoyouji-web
          SSH_KEY="$HOME/.ssh/deploy_key"
          SSH_CMD="ssh -i ${SSH_KEY} -p ${DEPLOY_PORT}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          LOCAL_LOCK_HASH=$(md5sum pnpm-lock.yaml | cut -d' ' -f1)
          REMOTE_LOCK_HASH=$(${SSH_CMD} "${REMOTE}" "md5sum ${APP_DIR}/pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || true")

          echo "部署目标提交：${EXPECTED_SHA}"
          echo "同步构建产物…"
          ${SSH_CMD} "${REMOTE}" "mkdir -p ${APP_DIR}/dist ${APP_DIR}/server"
          rsync -az --delete -e "${SSH_CMD}" dist/ "${REMOTE}:${APP_DIR}/dist/"
          rsync -az -e "${SSH_CMD}" package.json pnpm-lock.yaml "${REMOTE}:${APP_DIR}/"
          rsync -az -e "${SSH_CMD}" server/git-log.json "${REMOTE}:${APP_DIR}/server/git-log.json"
          sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' ecosystem.config.cjs > /tmp/haoyouji-ecosystem.config.cjs
          rsync -az -e "${SSH_CMD}" /tmp/haoyouji-ecosystem.config.cjs "${REMOTE}:${APP_DIR}/ecosystem.config.cjs"

          # 只有锁文件变化时才同步 node_modules；本次锁文件未变化，不会引入大文件传输。
          if [ "${LOCAL_LOCK_HASH}" != "${REMOTE_LOCK_HASH}" ]; then
            echo "锁文件变化，同步运行依赖…"
            rsync -az --delete -e "${SSH_CMD}" node_modules/ "${REMOTE}:${APP_DIR}/node_modules/"
          else
            echo "锁文件未变化，复用生产依赖。"
          fi

          ${SSH_CMD} "${REMOTE}" "EXPECTED_SHA='${EXPECTED_SHA}' bash -s" <<'ENDSSH'
          set -euo pipefail
          APP_DIR=/home/ubuntu/haoyouji-web
          chown -R ubuntu:ubuntu "$APP_DIR/dist" "$APP_DIR/server/git-log.json" "$APP_DIR/package.json" "$APP_DIR/pnpm-lock.yaml" "$APP_DIR/ecosystem.config.cjs"
          printf '%s\n' "$EXPECTED_SHA" > "$APP_DIR/dist/.deployed-commit"
          chown ubuntu:ubuntu "$APP_DIR/dist/.deployed-commit"

          echo "重启 PM2…"
          if sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null 2>&1; then
            sudo -u ubuntu env HOME=/home/ubuntu pm2 restart "$APP_DIR/ecosystem.config.cjs" --update-env
          else
            sudo -u ubuntu env HOME=/home/ubuntu pm2 start "$APP_DIR/ecosystem.config.cjs" --update-env
          fi
          sudo -u ubuntu env HOME=/home/ubuntu pm2 save
          sleep 3
          sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null
          sudo -u ubuntu env HOME=/home/ubuntu pm2 list

          echo "校验本机服务响应…"
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              echo "服务健康检查通过。"
              exit 0
            fi
            sleep 2
          done
          echo "PM2 已启动，但本机 HTTP 健康检查未通过。" >&2
          exit 1
          ENDSSH
