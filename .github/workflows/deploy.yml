name: 自动部署到生产服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web
            echo "📥 拉取最新代码..."
            git pull --rebase origin main
            echo "📦 安装依赖..."
            pnpm install
            echo "🔨 构建项目..."
            pnpm run build
            echo "📊 执行数据库迁移..."
            bash scripts/post-deploy-migration.sh || true
            echo "🔄 重启服务..."
            pm2 restart haoyouji-web
            echo "✅ 部署完成！"
          ENDSSH
      
      - name: 📢 部署结果通知
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败，请检查日志"
          fi
