name: 自动部署到生产服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 执行部署脚本
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cd /root/haoyouji-web && git fetch origin && git reset --hard origin/main && git clean -fd && bash scripts/deploy-server.sh"
      
      - name: 企业微信部署通知
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_TEXT="部署成功"
            STATUS_ICON="[成功]"
          else
            STATUS_TEXT="部署失败"
            STATUS_ICON="[失败]"
          fi
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=3-XQAnU8_8iKPA74O6_Gw3YQPdOIA2nIv4ILXpxcZ2g" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ${STATUS_ICON} 脉动网部署通知\\n> **状态**：${STATUS_TEXT}\\n> **提交**：${COMMIT_HASH}\\n> **内容**：${COMMIT_MSG}\\n> **时间**：$(date '+%Y-%m-%d %H:%M:%S')\"}}"
          echo "企业微信通知已发送"
