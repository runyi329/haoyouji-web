name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动重启服务'

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密鑰
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 直接写入已知的服务器指纹，避免ssh-keyscan超时问题
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
          # 备用：如果keyscan失败，使用StrictHostKeyChecking=no
          echo "Host 124.223.54.69" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      
      - name: 🚀 执行部署脚本（阶段1：拉代码+后台构建）
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            echo "📂 进入项目目录..."
            cd /root/haoyouji-web
            echo "📥 拉取最新代码..."
            git fetch origin && git reset --hard origin/main && git clean -fd
            echo "🧹 清除 Vite 缓存（保留旧 dist 继续服务）..."
            rm -rf node_modules/.vite client/.vite
            echo "📦 后台安装依赖+构建（不阻塞SSH连接）..."
            nohup bash -c '
              export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
              cd /root/haoyouji-web
              echo "[BUILD] 开始 pnpm install..." > /tmp/build.log
              pnpm install >> /tmp/build.log 2>&1 && \
              echo "[BUILD] pnpm install 完成，开始 build..." >> /tmp/build.log && \
              pnpm run build >> /tmp/build.log 2>&1 && \
              echo "[BUILD] BUILD_SUCCESS" >> /tmp/build.log || \
              echo "[BUILD] BUILD_FAILED" >> /tmp/build.log
            ' > /tmp/build-nohup.log 2>&1 &
            echo "后台构建已启动，PID: $!"
            echo "STARTED" > /tmp/build-status.txt
          ENDSSH

      - name: ⏳ 等待后台构建完成（轮询）
        timeout-minutes: 20
        run: |
          echo "等待服务器后台构建完成..."
          for i in $(seq 1 40); do
            sleep 30
            STATUS=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "tail -1 /tmp/build.log 2>/dev/null || echo 'WAITING'" 2>/dev/null || echo "SSH_FAIL")
            echo "[$i/40] 构建状态: $STATUS"
            if echo "$STATUS" | grep -q "BUILD_SUCCESS"; then
              echo "✅ 构建成功！"
              break
            fi
            if echo "$STATUS" | grep -q "BUILD_FAILED"; then
              echo "❌ 构建失败！"
              ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                "tail -50 /tmp/build.log" 2>/dev/null || true
              exit 1
            fi
          done

      - name: 🔄 部署阶段2：同步文件+重启服务
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            set -e
            echo "📊 执行数据库迁移..."
            cd /root/haoyouji-web
            bash scripts/post-deploy-migration.sh || true
            echo "📊 执行数据库结构更新..."
            bash scripts/db-migrations.sh || true
            echo "💳 注入支付宝环境变量..."
            node /root/haoyouji-web/scripts/inject-alipay-env.cjs
            echo "🔄 删除root PM2进程（释放3000端口）..."
            pm2 delete haoyouji-web 2>/dev/null || true
            pm2 save 2>/dev/null || true
            sleep 2
            echo "🔄 同步新代码到实际服务目录..."
            cp -r /root/haoyouji-web/dist/. /home/ubuntu/haoyouji-web/dist/
            cp /root/haoyouji-web/package.json /home/ubuntu/haoyouji-web/package.json
            cp /root/haoyouji-web/pnpm-lock.yaml /home/ubuntu/haoyouji-web/pnpm-lock.yaml
            chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist
            echo "🔄 同步node_modules..."
            rsync -a --delete /root/haoyouji-web/node_modules/ /home/ubuntu/haoyouji-web/node_modules/
            chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules
            echo "🔄 重启实际服务进程..."
            cp /root/haoyouji-web/.env /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env 2>/dev/null || true
            sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' /root/haoyouji-web/ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs
            chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs
            if sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 describe haoyouji-web > /dev/null 2>&1'; then
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 restart /home/ubuntu/haoyouji-web/ecosystem.config.cjs --update-env' 2>&1
            else
              sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs' 2>&1
            fi
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 save' 2>&1
            sleep 8
            echo "当前监听端口："
            ss -tlnp | grep ':3000\|:3001\|:8080' || echo '暂无3000/3001/8080端口监听'
            echo "ubuntu PM2进程状态："
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 list' 2>&1
            echo "✅ 部署完成！"
            echo "🔒 同步Nginx配置并重载Nginx..."
            cp /root/haoyouji-web/nginx.conf /etc/nginx/sites-available/haoyouji
            nginx -t && systemctl reload nginx
            echo "✅ Nginx配置已同步并重载"
          ENDSSH

      - name: 📊 部署后任务（非关键，失败不影响服务）
        timeout-minutes: 10
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            cd /root/haoyouji-web
            echo "📊 导入/更新黄金历史日K线数据..."
            node scripts/update-gold-daily.mjs || echo "⚠️ 黄金数据更新失败（非致命）"
            echo "📊 初始化/更新数字币价格缓存..."
            node scripts/seed-crypto-prices.mjs || echo "⚠️ 数字币价格初始化失败（非致命）"
            echo "🖼️ 上传交易所图标到腾讯云COS..."
            node scripts/upload-exchange-icons.mjs || echo "⚠️ 交易所图标上传失败（非致命）"
            echo "📊 预计算数字币相关性统计..."
            node scripts/compute-correlation.mjs || echo "⚠️ 相关性统计预计算失败（非致命）"
            source /root/haoyouji-web/.env 2>/dev/null || true
            DB_HOST=$(python3 -c "import os,re; u=os.environ.get('DATABASE_URL',''); m=re.search(r'@([^:/]+)', u); print(m.group(1) if m else '')" 2>/dev/null || echo "")
            DB_PORT=$(python3 -c "import os,re; u=os.environ.get('DATABASE_URL',''); m=re.search(r':([0-9]{4,5})/', u); print(m.group(1) if m else '4000')" 2>/dev/null || echo "4000")
            DB_USER=$(python3 -c "import os,re; u=os.environ.get('DATABASE_URL',''); m=re.search(r'://([^:]+):', u); print(m.group(1) if m else '')" 2>/dev/null || echo "")
            DB_PASS=$(python3 -c "import os,re; u=os.environ.get('DATABASE_URL',''); m=re.search(r'://[^:]+:([^@]+)@', u); print(m.group(1) if m else '')" 2>/dev/null || echo "")
            DB_NAME=$(python3 -c "import os,re; u=os.environ.get('DATABASE_URL',''); m=re.search(r'/([^/?]+)(\?|$)', u); print(m.group(1) if m else '')" 2>/dev/null || echo "")
            if [ -n "$DB_HOST" ]; then
              echo "=== 宠物平台数据库迁移 ==="
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                ALTER TABLE pet_user_roles ADD COLUMN IF NOT EXISTS is_admin TINYINT(1) NOT NULL DEFAULT 0 COMMENT '是否为宠物平台管理员';
              " 2>&1 && echo "✅ is_admin字段已就绪" || echo "⚠️ is_admin字段迁移失败（可能已存在）"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                UPDATE pet_user_roles SET is_admin = 1 WHERE user_id = (SELECT id FROM users WHERE username = 'jiang' LIMIT 1) AND is_admin = 0;
              " 2>&1 && echo "✅ jiang管理员权限已设置" || echo "⚠️ jiang管理员设置失败"
              echo "=== 其他数据库迁移 ==="
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                CREATE TABLE IF NOT EXISTS snt_withdrawals (
                  id int AUTO_INCREMENT NOT NULL PRIMARY KEY,
                  user_id int NOT NULL,
                  ledger_id int DEFAULT NULL,
                  snt_amount decimal(20, 4) NOT NULL,
                  bsc_address varchar(255) NOT NULL,
                  status enum('pending','processing','completed','rejected') DEFAULT 'pending' NOT NULL,
                  admin_note text,
                  txn_hash varchar(100),
                  created_at timestamp DEFAULT CURRENT_TIMESTAMP NOT NULL,
                  updated_at timestamp DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP NOT NULL,
                  INDEX snt_withdrawals_user_id_idx (user_id),
                  INDEX snt_withdrawals_status_idx (status),
                  INDEX snt_withdrawals_ledger_id_idx (ledger_id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              " 2>&1 && echo "✅ snt_withdrawals 表已就绪" || echo "⚠️ snt_withdrawals 建表失败"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                CREATE TABLE IF NOT EXISTS user_bsc_wallets (
                  id int AUTO_INCREMENT NOT NULL PRIMARY KEY,
                  user_id int NOT NULL,
                  bsc_address varchar(255) NOT NULL,
                  created_at timestamp DEFAULT CURRENT_TIMESTAMP NOT NULL,
                  updated_at timestamp DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP NOT NULL,
                  UNIQUE KEY user_bsc_wallets_user_id_unique (user_id),
                  INDEX user_bsc_wallets_user_id_idx (user_id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              " 2>&1 && echo "✅ user_bsc_wallets 表已就绪" || echo "⚠️ user_bsc_wallets 建表失败"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                CREATE TABLE IF NOT EXISTS snt_withdrawal_fee_rules (
                  id int AUTO_INCREMENT NOT NULL PRIMARY KEY,
                  ledger_id int DEFAULT NULL,
                  scope enum('global','user','user_and_downlines') DEFAULT 'global' NOT NULL,
                  target_user_id int DEFAULT NULL,
                  fee_rate decimal(5,4) DEFAULT 0.0000 NOT NULL,
                  fee_fixed decimal(20,4) DEFAULT 0.0000 NOT NULL,
                  min_fee decimal(20,4) DEFAULT 0.0000 NOT NULL,
                  max_fee decimal(20,4) DEFAULT NULL,
                  note varchar(255) DEFAULT NULL,
                  created_by int DEFAULT NULL,
                  created_at timestamp DEFAULT CURRENT_TIMESTAMP NOT NULL,
                  updated_at timestamp DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP NOT NULL,
                  INDEX snt_fee_rules_ledger_idx (ledger_id),
                  INDEX snt_fee_rules_target_user_idx (target_user_id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              " 2>&1 && echo "✅ snt_withdrawal_fee_rules 表已就绪" || echo "⚠️ snt_withdrawal_fee_rules 建表失败"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                INSERT IGNORE INTO snt_withdrawal_fee_rules (id, ledger_id, scope, target_user_id, fee_rate, fee_fixed, min_fee, note)
                VALUES (1, NULL, 'global', NULL, 0.0000, 0.0000, 0.0000, '全局默认手续费');
              " 2>&1 && echo "✅ 全局默认手续费规则已就绪" || echo "⚠️ 插入全局规则失败"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                CREATE TABLE IF NOT EXISTS funder_interest_payments (
                  id int AUTO_INCREMENT NOT NULL PRIMARY KEY,
                  order_id int NOT NULL,
                  ledger_id int NOT NULL,
                  amount decimal(20, 4) NOT NULL,
                  pay_date date NOT NULL,
                  note text,
                  created_by int NOT NULL,
                  created_at timestamp DEFAULT CURRENT_TIMESTAMP NOT NULL,
                  INDEX fip_order_id_idx (order_id),
                  INDEX fip_ledger_id_idx (ledger_id),
                  INDEX fip_pay_date_idx (pay_date)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              " 2>&1 && echo "✅ funder_interest_payments 表已就绪" || echo "⚠️ funder_interest_payments 建表失败"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                ALTER TABLE ledger_members ADD COLUMN shortcut_buttons JSON NULL DEFAULT NULL;
              " 2>&1 && echo "✅ shortcut_buttons 字段已添加" || echo "⚠️ shortcut_buttons 字段可能已存在（正常）"
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
                ALTER TABLE merchant_products ADD COLUMN inPointsShop TINYINT(1) NOT NULL DEFAULT 0 COMMENT '是否上架到积分商城（0=否，1=是）' AFTER isShareable;
              " 2>&1 && echo "✅ inPointsShop 字段已添加" || echo "⚠️ inPointsShop 字段可能已存在（正常）"
              GOLD_COUNT=$(mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -sN -e "SELECT COUNT(*) FROM gold_daily_kline;" 2>/dev/null || echo "0")
              echo "当前黄金数据条数: $GOLD_COUNT"
              if [ "$GOLD_COUNT" -lt 100 ] 2>/dev/null; then
                echo "数据不足，执行全量导入..."
                cd /root/haoyouji-web && node scripts/import-gold-history.mjs || echo "⚠️ 全量导入失败"
              fi
            else
              echo "DATABASE_URL not found, 跳过建表"
            fi
            echo "📊 同步数字币历史资金费率（增量/全量）..."
            cd /root/haoyouji-web && node scripts/sync-funding-rates.mjs >> /var/log/funding-rates-sync.log 2>&1 || echo "⚠️ 资金费率同步失败（非致命）"
            FUNDING_CRON="0 0,8,16 * * * cd /root/haoyouji-web && node scripts/sync-funding-rates.mjs >> /var/log/funding-rates-sync.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "sync-funding-rates"; echo "$FUNDING_CRON") | crontab -
            echo "✅ 资金费率每8小时自动同步cron任务已设置"
            HOURLY_KLINE_CRON="0 */2 * * * cd /root/haoyouji-web && for S in BTCUSDT ETHUSDT SOLUSDT; do node scripts/fetch-1h-klines-generic.mjs \$S >> /var/log/crypto-1h-sync.log 2>&1; done"
            (crontab -l 2>/dev/null | grep -v "fetch-1h-klines-generic"; echo "$HOURLY_KLINE_CRON") | crontab -
            echo "✅ 数字币小时线每2小时自动同步cron任务已设置"
            CRON_JOB="0 2 * * * cd /root/haoyouji-web && node scripts/update-gold-daily.mjs >> /var/log/gold-update.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "update-gold-daily"; echo "$CRON_JOB") | crontab -
            echo "✅ 黄金数据每日更新cron任务已设置"
            TRADING_COST_CRON_1="0 8 * * 1-5 cd /root/haoyouji-web && node scripts/update-trading-cost-2026.mjs >> /var/log/trading-cost-2026.log 2>&1"
            TRADING_COST_CRON_2="0 9 * * 1-5 cd /root/haoyouji-web && node scripts/update-trading-cost-2026.mjs >> /var/log/trading-cost-2026.log 2>&1"
            TRADING_COST_CRON_3="0 10 * * 1-5 cd /root/haoyouji-web && node scripts/update-trading-cost-2026.mjs >> /var/log/trading-cost-2026.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "update-trading-cost-2026"; echo "$TRADING_COST_CRON_1"; echo "$TRADING_COST_CRON_2"; echo "$TRADING_COST_CRON_3") | crontab -
            echo "✅ A股2026年交易成本每日更新cron任务已设置"
            echo "📤 上传同花顺股票图标到COS..."
            cd /root/haoyouji-web && node scripts/upload-ths-icon.mjs || echo "⚠️ 图标上传失败（非致命）"
            echo "🔍 执行COS诊断..."
            bash /root/haoyouji-web/scripts/diagnose-cos.sh || true
          ENDSSH
