name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
    paths-ignore:
      - "backups/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因"
        required: false
        default: "手动部署"

# 同一时间只允许一个生产部署；新提交按顺序部署，避免远端构建与 PM2 相互覆盖。
concurrency:
  group: haoyouji-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署指定提交到生产服务器
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'SSHEOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 10
            ConnectTimeout 20
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: 拉取、构建、同步并重启
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'ENDSSH'
          set -euo pipefail
          export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          SOURCE_DIR=/root/haoyouji-web
          APP_DIR=/home/ubuntu/haoyouji-web
          cd "$SOURCE_DIR"

          echo "部署目标提交：$EXPECTED_SHA"
          OLD_LOCK_HASH=$(md5sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo none)
          # 生产机到 GitHub 偶发 TLS 提前断连时，使用 HTTP/1.1 并短暂退避重试；
          # 只对网络拉取重试，后续校验、构建和 PM2 失败仍会立即失败并保留日志。
          FETCH_OK=0
          for attempt in 1 2 3 4; do
            if GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 fetch --quiet --no-tags origin main; then
              FETCH_OK=1
              break
            fi
            echo "第 ${attempt} 次拉取失败，${attempt}×3 秒后重试…" >&2
            sleep $((attempt * 3))
          done
          if [ "$FETCH_OK" -ne 1 ]; then
            echo "GitHub 拉取连续失败，未开始构建或重启。" >&2
            exit 1
          fi
          if ! git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
            echo "目标提交不在 origin/main 的已拉取历史中：$EXPECTED_SHA" >&2
            exit 1
          fi
          git reset --hard "$EXPECTED_SHA"
          git clean -fd
          DEPLOYED_SHA=$(git rev-parse HEAD)
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          NEW_LOCK_HASH=$(md5sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo none)
          echo "已锁定提交：$DEPLOYED_SHA"

          if [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
            echo "锁文件已变化，安装依赖…"
            pnpm install --frozen-lockfile
          else
            echo "锁文件未变化，跳过依赖安装。"
          fi

          echo "开始生产构建…"
          export NODE_OPTIONS="--max-old-space-size=4096"
          rm -rf "$SOURCE_DIR/dist"
          pnpm run build
          test -f "$SOURCE_DIR/dist/index.js"
          test -f "$SOURCE_DIR/dist/public/index.html"

          echo "同步构建产物…"
          mkdir -p "$APP_DIR/dist"
          rsync -a --delete "$SOURCE_DIR/dist/" "$APP_DIR/dist/"
          chown -R ubuntu:ubuntu "$APP_DIR/dist"
          cp "$SOURCE_DIR/package.json" "$APP_DIR/package.json"
          cp "$SOURCE_DIR/pnpm-lock.yaml" "$APP_DIR/pnpm-lock.yaml"
          cp "$SOURCE_DIR/server/git-log.json" "$APP_DIR/server/git-log.json" 2>/dev/null || true
          chown ubuntu:ubuntu "$APP_DIR/server/git-log.json" 2>/dev/null || true

          if [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
            echo "同步更新后的 node_modules…"
            rsync -a --delete "$SOURCE_DIR/node_modules/" "$APP_DIR/node_modules/"
            chown -R ubuntu:ubuntu "$APP_DIR/node_modules"
          fi

          cp "$SOURCE_DIR/.env" "$APP_DIR/.env" 2>/dev/null || true
          chown ubuntu:ubuntu "$APP_DIR/.env" 2>/dev/null || true
          sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' \
            "$SOURCE_DIR/ecosystem.config.cjs" > "$APP_DIR/ecosystem.config.cjs"
          chown ubuntu:ubuntu "$APP_DIR/ecosystem.config.cjs"

          echo "重启 PM2…"
          if sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null 2>&1; then
            sudo -u ubuntu env HOME=/home/ubuntu pm2 restart "$APP_DIR/ecosystem.config.cjs" --update-env
          else
            sudo -u ubuntu env HOME=/home/ubuntu pm2 start "$APP_DIR/ecosystem.config.cjs" --update-env
          fi
          sudo -u ubuntu env HOME=/home/ubuntu pm2 save
          sleep 3
          sudo -u ubuntu env HOME=/home/ubuntu pm2 describe haoyouji-web >/dev/null
          sudo -u ubuntu env HOME=/home/ubuntu pm2 list

          echo "校验本机服务响应…"
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              echo "服务健康检查通过。"
              exit 0
            fi
            sleep 2
          done
          echo "PM2 已启动，但本机 HTTP 健康检查未通过。" >&2
          exit 1
          ENDSSH
