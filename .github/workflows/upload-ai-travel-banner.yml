name: 上传AI旅行海报到COS
on:
  workflow_dispatch:
  push:
    paths:
      - 'client/public/ai-travel-banner.png'
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: 上传图片文件到服务器
        run: |
          scp -i ~/.ssh/id_rsa -P ${{ secrets.DEPLOY_PORT }} \
            client/public/ai-travel-banner.png \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ai-travel-banner.png
      - name: 在服务器上执行COS上传
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd /root/haoyouji-web
            # 读取COS密钥
            source .env 2>/dev/null || true
            COS_SECRET_ID="${COS_SECRET_ID:-}"
            COS_SECRET_KEY="${COS_SECRET_KEY:-}"
            BUCKET="haoyouji-images-1396946788"
            REGION="ap-shanghai"
            node - << 'JSEOF'
            const { createRequire } = require('module');
            const require = createRequire(__filename);
            const { readFileSync } = require('fs');
            const COS = require('cos-nodejs-sdk-v5');
            const cos = new COS({
              SecretId: process.env.COS_SECRET_ID,
              SecretKey: process.env.COS_SECRET_KEY,
            });
            const buffer = readFileSync('/tmp/ai-travel-banner.png');
            cos.putObject({
              Bucket: 'haoyouji-images-1396946788',
              Region: 'ap-shanghai',
              Key: 'assets/banners/ai-travel-banner.png',
              Body: buffer,
              ContentType: 'image/png',
            }, (err, data) => {
              if (err) { console.error('上传失败:', err.message); process.exit(1); }
              console.log('上传成功: https://haoyouji-images-1396946788.cos.ap-shanghai.myqcloud.com/assets/banners/ai-travel-banner.png');
            });
            JSEOF
          ENDSSH
