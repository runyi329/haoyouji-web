name: 磁盘空间清理
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host 124.223.54.69" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: 执行清理
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "===== 清理前磁盘使用 ====="
            df -h / | tail -1

            echo ""
            echo "===== 1. 删除旧版 zip 压缩包 ====="
            for f in ~/haoyouji-web.zip ~/haoyouji-web_new.zip ~/haoyouji-deploy.zip; do
              if [ -f "$f" ]; then
                size=$(du -sh "$f" | cut -f1)
                rm -f "$f"
                echo "✅ 已删除: $f ($size)"
              else
                echo "⏭  不存在: $f"
              fi
            done

            echo ""
            echo "===== 2. 清理 pnpm store 缓存 ====="
            before=$(du -sh ~/.local/share/pnpm 2>/dev/null | cut -f1 || echo "0")
            pnpm store prune 2>&1 | tail -3
            after=$(du -sh ~/.local/share/pnpm 2>/dev/null | cut -f1 || echo "0")
            echo "清理前: $before → 清理后: $after"

            echo ""
            echo "===== 3. 清理 npm 缓存 ====="
            before=$(du -sh ~/.npm 2>/dev/null | cut -f1 || echo "0")
            npm cache clean --force 2>&1 | tail -2
            after=$(du -sh ~/.npm 2>/dev/null | cut -f1 || echo "0")
            echo "清理前: $before → 清理后: $after"

            echo ""
            echo "===== 4. 清理 systemd journal 日志（保留最近100MB） ====="
            before=$(du -sh /var/log/journal 2>/dev/null | cut -f1 || echo "0")
            journalctl --vacuum-size=100M 2>&1
            after=$(du -sh /var/log/journal 2>/dev/null | cut -f1 || echo "0")
            echo "清理前: $before → 清理后: $after"

            echo ""
            echo "===== 5. 清理 apt 缓存 ====="
            before=$(du -sh /var/cache/apt 2>/dev/null | cut -f1 || echo "0")
            apt-get clean -y 2>&1 | tail -2
            after=$(du -sh /var/cache/apt 2>/dev/null | cut -f1 || echo "0")
            echo "清理前: $before → 清理后: $after"

            echo ""
            echo "===== 清理后磁盘使用 ====="
            df -h / | tail -1

            echo ""
            echo "===== 完成 ====="
          ENDSSH
