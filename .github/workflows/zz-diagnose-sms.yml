# triggered: 2026-04-18 retry after key update
name: zz-diagnose-sms
on:
  push:
    paths:
      - '.github/workflows/zz-diagnose-sms.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 诊断SMS配置
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          echo "=== 当前SMS环境变量 ==="
          grep "TENCENT_SMS" /root/haoyouji-web/.env 2>/dev/null
          echo "=== 用Node.js直接调用腾讯云API查询所有模板 ==="
          cd /root/haoyouji-web
          source .env 2>/dev/null || true
          node -e "
          const tencentcloud = require('tencentcloud-sdk-nodejs');
          const SmsClient = tencentcloud.sms.v20210111.Client;
          const client = new SmsClient({
            credential: { secretId: process.env.COS_SECRET_ID, secretKey: process.env.COS_SECRET_KEY },
            region: process.env.TENCENT_SMS_REGION || 'ap-guangzhou',
            profile: { httpProfile: { endpoint: 'sms.tencentcloudapi.com' } },
          });
          client.DescribeSmsTemplateList({ International: 0, TemplateIdSet: [], Limit: 100, Offset: 0 })
            .then(r => {
              const list = r.TemplateStatusSet || [];
              console.log('模板总数:', list.length);
              list.forEach(t => console.log('ID:', t.TemplateId, '名称:', t.TemplateName, '状态码:', t.StatusCode));
            })
            .catch(e => console.error('API错误:', e.code, e.message));
          " 2>&1
          ENDSSH
