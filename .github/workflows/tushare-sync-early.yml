name: Tushare 早期数据补充（1990-1995年）

on:
  workflow_dispatch:

jobs:
  sync-early:
    name: 补充同步1990-1995年A股历史数据
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 上传脚本和依赖到服务器
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_PORT }} \
            scripts/tushare/sync_early.py \
            scripts/tushare/PyMySQL-1.1.1-py3-none-any.whl \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/

      - name: 🚀 在服务器上安装依赖并运行同步
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "=== 安装依赖 ==="
            pip3 install /root/PyMySQL-1.1.1-py3-none-any.whl --break-system-packages -q 2>/dev/null || true

            echo "=== 启动早期数据同步 ==="
            cd /root
            nohup python3 /root/sync_early.py > /root/sync_early_stdout.log 2>&1 &
            SYNC_PID=$!
            echo "同步进程 PID: $SYNC_PID"

            # 等待同步完成，每30秒输出一次进度
            while kill -0 $SYNC_PID 2>/dev/null; do
              sleep 30
              echo "--- $(date '+%H:%M:%S') 进度 ---"
              tail -3 /root/sync_early.log 2>/dev/null || echo "日志尚未生成"
            done

            echo "=== 同步完成，最终日志 ==="
            tail -20 /root/sync_early.log 2>/dev/null || cat /root/sync_early_stdout.log 2>/dev/null
          ENDSSH
