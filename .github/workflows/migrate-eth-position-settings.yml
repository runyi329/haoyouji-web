name: 迁移eth_position_settings表结构
on:
  push:
    branches:
      - migrate-eth-settings
jobs:
  migrate:
    name: 给eth_position_settings表加price_step字段
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 执行数据库迁移
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db << 'EOSQL'
          SET @col_exists = (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='eth_position_settings' AND COLUMN_NAME='price_step');
          SET @sql = IF(@col_exists = 0, 'ALTER TABLE eth_position_settings ADD COLUMN price_step INT NOT NULL DEFAULT 50', 'SELECT \"price_step already exists\"');
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='eth_position_settings';
          EOSQL"
