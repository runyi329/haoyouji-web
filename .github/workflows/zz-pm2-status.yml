name: zz-pm2-status
on:
  push:
    paths:
      - '.github/workflows/zz-pm2-status.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Check PM2 status and code version
        run: |
          ssh -o StrictHostKeyChecking=no root@124.223.54.69 << 'ENDSSH'
            echo "=== PM2 进程状态 ==="
            pm2 list 2>/dev/null || echo "PM2未运行"
            echo ""
            echo "=== 服务器代码版本（最近5次commit）==="
            cd /root/haoyouji-web && git log --oneline -5 2>/dev/null || echo "无法获取git log"
            echo ""
            echo "=== 服务器上的channel_type检查 ==="
            grep -n "channel_type" /root/haoyouji-web/server/wecom-manus-router.ts 2>/dev/null | grep -v "^Binary" | head -10 || echo "找不到文件"
            echo ""
            echo "=== PM2日志（最近50行，含Manus/专属规则）==="
            pm2 logs --lines 300 --nostream 2>/dev/null | grep -E "\[Manus\]|\[专属规则\]|MANUS|task\.create|创建新任务" | tail -30 || echo "无相关日志"
            echo ""
            echo "=== 完整deploy日志 ==="
            cat /tmp/haoyouji-deploy.log 2>/dev/null | tail -20 || echo "无deploy日志"
ENDSSH
