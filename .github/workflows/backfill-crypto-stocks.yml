name: 补齐美股和数字币日线数据
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-crypto-stocks.yml'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 补齐美股和数字币数据
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 600s
          script: |
            set -e
            echo "=== 开始补齐美股和数字币日线数据 ==="

            pip3 install pymysql requests -q 2>/dev/null || true

            python3 << 'PYEOF'
import pymysql, requests, time
from datetime import datetime, timedelta, timezone

DB_CONFIG = {
    'host': '127.0.0.1', 'port': 3306,
    'user': 'root', 'password': 'Miao@20190603',
    'database': 'crm_db', 'charset': 'utf8mb4',
}

def get_conn():
    return pymysql.connect(**DB_CONFIG)

def get_latest_date(symbol):
    conn = get_conn()
    try:
        with conn.cursor() as cur:
            cur.execute("SELECT MAX(date) FROM crypto_klines WHERE symbol=%s AND date >= '2000-01-01'", (symbol,))
            row = cur.fetchone()
            return str(row[0]) if row and row[0] else None
    finally:
        conn.close()

def upsert_kline(symbol, date_str, open_p, high_p, low_p, close_p, volume):
    conn = get_conn()
    try:
        with conn.cursor() as cur:
            cur.execute("""
                INSERT INTO crypto_klines (symbol, date, open, high, low, close, volume)
                VALUES (%s, %s, %s, %s, %s, %s, %s)
                ON DUPLICATE KEY UPDATE
                  open=VALUES(open), high=VALUES(high), low=VALUES(low),
                  close=VALUES(close), volume=VALUES(volume)
            """, (symbol, date_str, open_p, high_p, low_p, close_p, volume))
        conn.commit()
    finally:
        conn.close()

# ── 美股七姐妹 ──────────────────────────────────────────────────────────────
US_STOCKS = ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'NVDA', 'TSLA', 'META']

for sym in US_STOCKS:
    latest = get_latest_date(sym)
    if latest:
        start_dt = datetime.strptime(latest, '%Y-%m-%d') + timedelta(days=1)
    else:
        start_dt = datetime(2010, 1, 1)
    
    now = datetime.utcnow()
    if start_dt.date() > now.date():
        print(f"[{sym}] 已是最新 ({latest})，跳过")
        continue
    
    period1 = int(start_dt.timestamp())
    period2 = int(now.timestamp())
    
    url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?interval=1d&period1={period1}&period2={period2}&events=history"
    
    added = 0
    for attempt in range(3):
        try:
            resp = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=20)
            if resp.status_code != 200:
                # 备用
                url2 = url.replace('query1', 'query2')
                resp = requests.get(url2, headers={'User-Agent': 'Mozilla/5.0'}, timeout=20)
            data = resp.json()
            result = data.get('chart', {}).get('result', [None])[0]
            if not result:
                print(f"[{sym}] Yahoo 返回空数据")
                break
            
            timestamps = result.get('timestamp', [])
            ohlcv = result.get('indicators', {}).get('quote', [{}])[0]
            opens = ohlcv.get('open', [])
            highs = ohlcv.get('high', [])
            lows = ohlcv.get('low', [])
            closes = ohlcv.get('close', [])
            volumes = ohlcv.get('volume', [])
            
            for i, ts in enumerate(timestamps):
                if ts is None: continue
                dt = datetime.utcfromtimestamp(ts)
                if dt.year < 2000: continue
                date_str = dt.strftime('%Y-%m-%d')
                o = opens[i] if i < len(opens) and opens[i] else None
                h = highs[i] if i < len(highs) and highs[i] else None
                l = lows[i] if i < len(lows) and lows[i] else None
                c = closes[i] if i < len(closes) and closes[i] else None
                v = volumes[i] if i < len(volumes) and volumes[i] else 0
                if not all([o, h, l, c]): continue
                upsert_kline(sym, date_str, round(o,4), round(h,4), round(l,4), round(c,4), int(v))
                added += 1
            
            print(f"[{sym}] 新增/更新 {added} 条，最新日期: {date_str if timestamps else latest}")
            break
        except Exception as e:
            print(f"[{sym}] 第{attempt+1}次失败: {e}")
            time.sleep(3)

# ── 数字币 BTC/ETH ────────────────────────────────────────────────────────
CRYPTO_SYMBOLS = ['BTCUSDT', 'ETHUSDT']

for sym in CRYPTO_SYMBOLS:
    latest = get_latest_date(sym)
    if latest:
        start_dt = datetime.strptime(latest, '%Y-%m-%d') + timedelta(days=1)
    else:
        start_dt = datetime(2017, 1, 1)
    
    now_utc = datetime.utcnow()
    if start_dt.date() > now_utc.date():
        print(f"[{sym}] 已是最新 ({latest})，跳过")
        continue
    
    ticker = sym.replace('USDT', '')
    start_ms = int(start_dt.timestamp() * 1000)
    
    added = 0
    while True:
        url = f"https://api.binance.com/api/v3/klines?symbol={sym}&interval=1d&startTime={start_ms}&limit=1000"
        try:
            resp = requests.get(url, timeout=15)
            klines = resp.json()
            if not klines or not isinstance(klines, list): break
            
            for k in klines:
                ts = k[0]
                dt = datetime.utcfromtimestamp(ts / 1000)
                if dt.date() >= now_utc.date(): continue  # 跳过未收盘的当天
                date_str = dt.strftime('%Y-%m-%d')
                o, h, l, c, v = float(k[1]), float(k[2]), float(k[3]), float(k[4]), float(k[5])
                upsert_kline(sym, date_str, round(o,4), round(h,4), round(l,4), round(c,4), round(v,4))
                added += 1
            
            if len(klines) < 1000: break
            start_ms = klines[-1][0] + 86400000
            time.sleep(0.2)
        except Exception as e:
            print(f"[{sym}] Binance 请求失败: {e}")
            break
    
    new_latest = get_latest_date(sym)
    print(f"[{sym}] 新增/更新 {added} 条，最新日期: {new_latest}")

print("=== 全部补齐完成 ===")
PYEOF
