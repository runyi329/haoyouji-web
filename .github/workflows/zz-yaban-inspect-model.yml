name: zz 牙伴演示院数据核对
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 查询表结构
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== users 列结构 ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SHOW COLUMNS FROM users;"
            echo "=== users 行数 ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SELECT COUNT(*) AS user_cnt FROM users;"
            echo "=== users 样例(脱敏 前3行 仅看哪些字段必填) ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SELECT id, name, LEFT(IFNULL(mobile,''),3) AS m3, IFNULL(avatar,'') <> '' AS has_avatar FROM users ORDER BY id ASC LIMIT 3;"
            echo "=== yaban_shift_template 列结构 ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SHOW COLUMNS FROM yaban_shift_template;"
            echo "=== yaban_clinic_member 列结构 ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SHOW COLUMNS FROM yaban_clinic_member;"
            echo "=== 9999 现有 shift_template 数量 ==="
            mysql -u root -p'Miao@20190603' crm_db -e "SELECT COUNT(*) AS cnt FROM yaban_shift_template WHERE tenant_id=9999;" 2>/dev/null || echo "查询失败"
