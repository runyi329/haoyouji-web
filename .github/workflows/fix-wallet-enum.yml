name: Fix digital_wallets wallet_type ENUM

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 yes 确认执行'
        required: true
        default: 'yes'

jobs:
  fix-enum:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute ALTER TABLE via MySQL on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            mysql -h 124.223.54.69 -P 3306 -u root -pMiao@20190603 crm_db -e "ALTER TABLE digital_wallets MODIFY COLUMN wallet_type ENUM('blockchain', 'binance', 'okx', 'alipay', 'wechat', 'other') NOT NULL;" 2>&1 && echo "SUCCESS: ENUM updated" || echo "ERROR: failed"
          ENDSSH
