name: Update Custom Rule SQL (Temporary)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-rule-sql.yml'

jobs:
  update-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ServerAliveInterval 20\n  ServerAliveCountMax 20\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: execute sql update via base64
        run: |
          SQL_B64=""
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo '${SQL_B64}' | base64 -d | mysql --default-character-set=utf8mb4 -u root -pMiao@20190603 crm_db"
