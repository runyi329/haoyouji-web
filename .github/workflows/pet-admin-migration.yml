name: 宠物平台-添加管理员字段和初始化jiang管理员
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '执行原因'
        required: false
        default: '初始化宠物平台管理员'
jobs:
  migrate:
    name: 执行宠物平台管理员迁移
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host ${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: 执行数据库迁移
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            DB_CMD="mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db"
            
            echo "=== 步骤1: 检查并添加 is_admin 字段 ==="
            $DB_CMD -e "
              SELECT COUNT(*) as col_exists 
              FROM information_schema.COLUMNS 
              WHERE TABLE_SCHEMA='crm_db' 
              AND TABLE_NAME='pet_user_roles' 
              AND COLUMN_NAME='is_admin';
            "
            
            $DB_CMD -e "
              ALTER TABLE pet_user_roles 
              ADD COLUMN IF NOT EXISTS is_admin TINYINT(1) NOT NULL DEFAULT 0;
            " 2>/dev/null || \
            $DB_CMD -e "
              SELECT IF(
                COUNT(*) = 0,
                'NEED_ADD',
                'ALREADY_EXISTS'
              ) as status
              FROM information_schema.COLUMNS 
              WHERE TABLE_SCHEMA='crm_db' 
              AND TABLE_NAME='pet_user_roles' 
              AND COLUMN_NAME='is_admin';
            "
            
            echo "=== 步骤2: 查找 jiang 的用户ID ==="
            $DB_CMD -e "SELECT id, name, username, phone FROM users WHERE name LIKE '%jiang%' OR username LIKE '%jiang%' LIMIT 10;"
            
            echo "=== 步骤3: 给 jiang 设置厂家+管理员角色 ==="
            JIANG_ID=$($DB_CMD -sN -e "SELECT id FROM users WHERE name='jiang' OR username='jiang' LIMIT 1;")
            echo "jiang 的用户ID: $JIANG_ID"
            
            if [ -n "$JIANG_ID" ]; then
              $DB_CMD -e "
                INSERT INTO pet_user_roles (user_id, role, is_admin, remark) 
                VALUES ($JIANG_ID, 'manufacturer', 1, '厂家兼管理员')
                ON DUPLICATE KEY UPDATE 
                  role='manufacturer', 
                  is_admin=1, 
                  remark='厂家兼管理员',
                  updated_at=NOW();
              "
              echo "✅ jiang (ID=$JIANG_ID) 已设置为厂家+管理员"
            else
              echo "⚠️ 未找到名为 jiang 的用户，请手动检查"
              $DB_CMD -e "SELECT id, name, username FROM users ORDER BY id DESC LIMIT 20;"
            fi
            
            echo "=== 步骤4: 验证结果 ==="
            $DB_CMD -e "
              SELECT u.id, u.name, u.username, pr.role, pr.is_admin, pr.remark
              FROM users u
              JOIN pet_user_roles pr ON u.id = pr.user_id
              ORDER BY pr.is_admin DESC, u.id DESC
              LIMIT 10;
            "
            
            echo "=== 迁移完成 ==="
          ENDSSH
