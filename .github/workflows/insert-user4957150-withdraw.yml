name: 补入用户4957150提现申请

on:
  push:
    paths:
      - '.github/workflows/insert-user4957150-withdraw.yml'

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 💰 补入100 USDT提现申请（测试）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
            source /root/haoyouji-web/.env 2>/dev/null || true
            DB_HOST=$(echo ${DATABASE_URL:-} | grep -oP "(?<=@)[^:/]+" || echo "")
            DB_PORT=$(echo ${DATABASE_URL:-} | grep -oP "(?<=:)[0-9]{4,5}(?=/)" | tail -1 || echo "4000")
            DB_USER=$(echo ${DATABASE_URL:-} | grep -oP "(?<=://)[^:]+" || echo "")
            DB_PASS=$(echo ${DATABASE_URL:-} | grep -oP "(?<=://[^:]+:)[^@]+" || echo "")
            DB_NAME=$(echo ${DATABASE_URL:-} | grep -oP "(?<=/)[^?]+$" || echo "")

            USER_ID=4957150
            LEDGER_ID=52
            AMOUNT=100
            ADDRESS="0xf96505b0d41054455e904af175a74993a98137802578672864f6020b7f8a2587"

            echo "=== 直接写入 snt_withdrawals（不检查余额，测试用）==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
            INSERT INTO snt_withdrawals (user_id, ledger_id, snt_amount, bsc_address, status, created_at, updated_at)
            VALUES ($USER_ID, $LEDGER_ID, $AMOUNT, '$ADDRESS', 'pending', NOW(), NOW());
            " 2>&1

            WITHDRAW_ID=$(mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -sN -e "
            SELECT LAST_INSERT_ID();
            " 2>/dev/null || echo "0")
            echo "写入的 ID: $WITHDRAW_ID"

            echo "=== 验证：查询 snt_withdrawals 中用户4957150的所有记录 ==="
            mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --ssl-mode=REQUIRED "$DB_NAME" -e "
            SELECT id, user_id, ledger_id, snt_amount, LEFT(bsc_address,20) as addr, status, created_at
            FROM snt_withdrawals WHERE user_id = $USER_ID ORDER BY id DESC LIMIT 10;
            " 2>&1
          ENDSSH
