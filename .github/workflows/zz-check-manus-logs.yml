name: zz-check-manus-logs
on:
  push:
    paths:
      - '.github/workflows/zz-check-manus-logs.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 设置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: 检查MANUS配置和PM2日志
        run: |
          ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no root@124.223.54.69 << 'ENDSSH'
            echo "=== /root/haoyouji-web/.env MANUS相关配置 ==="
            grep -i "manus" /root/haoyouji-web/.env 2>/dev/null || echo "未找到MANUS配置"
            echo ""
            echo "=== PM2最近100行日志（含Manus关键词）==="
            pm2 logs --lines 100 --nostream 2>/dev/null | grep -i "manus\|专属规则\|getOrCreate\|task.create\|MANUS_API" | tail -50 || echo "无相关日志"
            echo ""
            echo "=== 测试Manus API ==="
            MANUS_KEY=$(grep "MANUS_API_KEY" /root/haoyouji-web/.env 2>/dev/null | cut -d'=' -f2- | tr -d '"' | tr -d "'" || echo "")
            if [ -n "$MANUS_KEY" ]; then
              echo "MANUS_KEY前20字符: ${MANUS_KEY:0:20}..."
              HTTP_CODE=$(curl -s -o /tmp/manus_resp.txt -w "%{http_code}" -H "x-manus-api-key: $MANUS_KEY" "https://api.manus.ai/v2/usage.list?limit=1")
              echo "API响应码: $HTTP_CODE"
              cat /tmp/manus_resp.txt | head -c 200
            else
              echo "MANUS_API_KEY为空，检查PM2环境变量"
              pm2 env 0 2>/dev/null | grep -i "manus" || echo "PM2 env中也无MANUS"
            fi
ENDSSH
