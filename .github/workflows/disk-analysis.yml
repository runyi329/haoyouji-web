name: 磁盘空间详细分析
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host 124.223.54.69" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: 分析磁盘占用
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "===== 1. 整体磁盘分区使用 ====="
            df -h

            echo ""
            echo "===== 2. 根目录一级占用 TOP ====="
            du -sh /* 2>/dev/null | sort -rh | head -20

            echo ""
            echo "===== 3. /root 目录各子目录占用 ====="
            du -sh /root/* 2>/dev/null | sort -rh | head -30

            echo ""
            echo "===== 4. /var 目录各子目录占用 ====="
            du -sh /var/* 2>/dev/null | sort -rh | head -20

            echo ""
            echo "===== 5. /usr 目录各子目录占用 ====="
            du -sh /usr/* 2>/dev/null | sort -rh | head -10

            echo ""
            echo "===== 6. haoyouji-web 项目目录占用 ====="
            du -sh /root/haoyouji-web/* 2>/dev/null | sort -rh | head -20

            echo ""
            echo "===== 7. 数据库备份目录 ====="
            du -sh /root/database-backups/ 2>/dev/null
            ls -lh /root/database-backups/*.sql.gz 2>/dev/null | awk '{print $5, $9}' | head -20

            echo ""
            echo "===== 8. 系统日志占用 ====="
            du -sh /var/log/* 2>/dev/null | sort -rh | head -15

            echo ""
            echo "===== 9. Docker 占用（如有） ====="
            docker system df 2>/dev/null || echo "未安装 Docker"

            echo ""
            echo "===== 10. npm/pnpm 缓存 ====="
            du -sh ~/.npm 2>/dev/null || echo "无 npm 缓存"
            du -sh ~/.pnpm-store 2>/dev/null || echo "无 pnpm-store"
            du -sh /root/.local/share/pnpm 2>/dev/null || echo "无 pnpm global"

            echo ""
            echo "===== 11. node_modules 占用 ====="
            find /root -name "node_modules" -maxdepth 4 -type d 2>/dev/null | while read d; do
              size=$(du -sh "$d" 2>/dev/null | cut -f1)
              echo "$size  $d"
            done | sort -rh | head -10
          ENDSSH
