name: 回填订单063/065历史最低价和档位
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '回填ETH订单063/065历史最低价1748.63和档位'

jobs:
  fix:
    name: 回填订单063/065档位
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔄 在服务器上执行回填
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
            set -e
            echo "=== 开始回填订单063/065历史最低价和档位 ==="

            # 读取.env获取数据库连接
            ENV_FILE=""
            if [ -f /root/haoyouji-web/.env ]; then
              ENV_FILE="/root/haoyouji-web/.env"
            elif [ -f /home/ubuntu/haoyouji-web/.env ]; then
              ENV_FILE="/home/ubuntu/haoyouji-web/.env"
            fi
            echo "使用env文件: $ENV_FILE"

            DATABASE_URL=$(grep "^ORIGINAL_DATABASE_URL=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '"' || echo "")
            if [ -z "$DATABASE_URL" ]; then
              DATABASE_URL=$(grep "^DATABASE_URL=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '"' || echo "")
            fi
            if [ -z "$DATABASE_URL" ]; then
              echo "❌ 未找到 DATABASE_URL"
              exit 1
            fi
            echo "DATABASE_URL已获取: ${DATABASE_URL:0:40}..."

            pip3 install pymysql -q 2>/dev/null || true

            python3 - "$DATABASE_URL" << 'PYEOF'
import sys, re, pymysql
from datetime import datetime, timezone

DATABASE_URL = sys.argv[1]

def parse_url(url):
    m = re.match(r'mysql://([^:]+):([^@]+)@([^:/]+):?([0-9]*)/([^?]+)', url)
    if not m:
        raise ValueError(f"无法解析 DATABASE_URL: {url[:40]}")
    user, pwd, host, port, db = m.groups()
    return host, int(port or 3306), user, pwd, db

DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME = parse_url(DATABASE_URL)
print(f"连接: {DB_HOST}:{DB_PORT}/{DB_NAME}")

conn = pymysql.connect(
    host=DB_HOST, port=DB_PORT, user=DB_USER, password=DB_PASS,
    database=DB_NAME, charset='utf8mb4', connect_timeout=30
)
print("数据库连接成功")

# 2026-02-06 ETH 历史最低价
ALL_TIME_LOW = "1748.63"
ALL_TIME_LOW_AT_STR = "2026-02-06 00:00:00"
ALL_TIME_LOW_AT_MS = int(datetime(2026, 2, 6, 0, 0, 0, tzinfo=timezone.utc).timestamp() * 1000)

# 目标订单配置
TARGET_ORDERS = [
    {"buy_price": 3850, "confirmed_from": "2025-10-28", "confirmed_to": "2025-11-05", "label": "订单063"},
    {"buy_price": 3014, "confirmed_from": "2025-11-25", "confirmed_to": "2025-12-01", "label": "订单065"},
]

with conn.cursor(pymysql.cursors.DictCursor) as cur:
    for target in TARGET_ORDERS:
        print(f"\n========== 处理 {target['label']} (买入价{target['buy_price']}) ==========")

        # 1. 查找正单
        cur.execute("""
            SELECT id, coin, limit_price, confirmed_at
            FROM af_orders
            WHERE coin = 'ETH'
              AND status = 'completed'
              AND confirmed_at BETWEEN %s AND %s
              AND (is_gift IS NULL OR is_gift = 0)
              AND (source_order_id IS NULL OR source_order_id = 0)
            ORDER BY ABS(CAST(limit_price AS DECIMAL(20,8)) - %s) ASC
            LIMIT 3
        """, (target["confirmed_from"], target["confirmed_to"], target["buy_price"]))
        candidates = cur.fetchall()
        print(f"候选正单: {[(o['id'], o['limit_price'], str(o['confirmed_at'])) for o in candidates]}")

        if not candidates:
            print(f"❌ 未找到 {target['label']}，跳过")
            continue

        main_order = candidates[0]
        print(f"✅ 选定正单 #{main_order['id']}，买入价 {main_order['limit_price']}")

        # 2. 查找赠与单
        cur.execute("""
            SELECT id FROM af_orders
            WHERE source_order_id = %s AND coin = 'ETH'
        """, (main_order["id"],))
        gift_orders = cur.fetchall()
        print(f"赠与单({len(gift_orders)}笔): {[o['id'] for o in gift_orders]}")

        all_order_ids = [main_order["id"]] + [o["id"] for o in gift_orders]
        buy_price = float(main_order["limit_price"])

        # 计算最高档位
        drop_pct = (buy_price - float(ALL_TIME_LOW)) / buy_price
        max_tier = min(int(drop_pct / 0.1), 9)
        print(f"跌幅: {drop_pct*100:.2f}%，应触发到第{max_tier}档")

        for order_id in all_order_ids:
            # 3. 更新 af_order_scan_stats
            cur.execute("SELECT id, all_time_low_price FROM af_order_scan_stats WHERE order_id = %s", (order_id,))
            stats = cur.fetchone()

            if stats:
                current_low = float(stats["all_time_low_price"]) if stats["all_time_low_price"] else 999999
                if float(ALL_TIME_LOW) < current_low:
                    cur.execute("""
                        UPDATE af_order_scan_stats
                        SET all_time_low_price = %s, all_time_low_at = %s, updated_at = NOW()
                        WHERE order_id = %s
                    """, (ALL_TIME_LOW, ALL_TIME_LOW_AT_STR, order_id))
                    conn.commit()
                    print(f"  ✅ 订单#{order_id} 更新最低价: {current_low} → {ALL_TIME_LOW}")
                else:
                    print(f"  ⏭️  订单#{order_id} 当前最低价{current_low}已更低，跳过")
            else:
                cur.execute("""
                    INSERT INTO af_order_scan_stats (order_id, coin, scan_count, last_scan_at, last_low_price, all_time_low_price, all_time_low_at, created_at, updated_at)
                    VALUES (%s, 'ETH', 1, %s, %s, %s, %s, NOW(), NOW())
                """, (order_id, ALL_TIME_LOW_AT_STR, ALL_TIME_LOW, ALL_TIME_LOW, ALL_TIME_LOW_AT_STR))
                conn.commit()
                print(f"  ✅ 订单#{order_id} 插入新扫描统计记录")

            # 4. 补录档位触发记录
            cur.execute("SELECT COALESCE(MAX(tier), 0) as maxTier FROM af_order_tier_triggers WHERE order_id = %s", (order_id,))
            row = cur.fetchone()
            current_max_tier = int(row["maxTier"]) if row else 0
            print(f"  订单#{order_id} 当前最高档位: {current_max_tier}，需要补录到第{max_tier}档")

            if current_max_tier >= max_tier:
                print(f"  ⏭️  订单#{order_id} 档位已足够，跳过")
                continue

            cur.execute("SELECT ledger_id FROM af_orders WHERE id = %s", (order_id,))
            order_info = cur.fetchone()
            ledger_id = order_info["ledger_id"] if order_info else 0

            for tier in range(current_max_tier + 1, max_tier + 1):
                tier_price = f"{buy_price * (1 - tier * 0.1):.2f}"
                cur.execute("""
                    INSERT INTO af_order_tier_triggers (order_id, ledger_id, coin, tier, trigger_price, triggered_at, created_at)
                    VALUES (%s, %s, 'ETH', %s, %s, %s, NOW())
                """, (order_id, ledger_id, tier, tier_price, ALL_TIME_LOW_AT_MS))
                conn.commit()
                print(f"  ✅ 订单#{order_id} 补录第{tier}档，触发价 {tier_price}")

conn.close()
print("\n🎉 全部回填完成！")
PYEOF

            echo "=== 脚本执行完毕 ==="
ENDSSH
