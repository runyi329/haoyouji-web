name: 恢复生产 Nginx 服务

on:
  workflow_dispatch:
  push:
    branches:
      - ops/nginx-static-diagnose-20261031

jobs:
  recover:
    name: 恢复生产反代与静态资源
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 配置 SSH 密钥
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT }}
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: 上传已修正的Nginx配置
        run: |
          set -euo pipefail
          scp nginx.conf production:/tmp/haoyouji-nginx-recovery.conf

      - name: 带自动回滚恢复生产入口
        run: |
          set -euo pipefail
          ssh production 'bash -s' <<'ENDSSH'
            set -euo pipefail
            HOST=jiangyuchen.cn
            APP_DIR=/home/ubuntu/haoyouji-web
            NGINX_SITE=/etc/nginx/sites-available/haoyouji
            NGINX_ENABLED=/etc/nginx/sites-enabled/haoyouji
            CANDIDATE=/tmp/haoyouji-nginx-recovery.conf

            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/version)" = '200'
            test -f "$CANDIDATE"
            backup="$(mktemp /tmp/haoyouji-nginx-before-recovery.XXXXXX)"
            sudo -n cp -a "$NGINX_SITE" "$backup"
            rollback() {
              sudo -n cp -a "$backup" "$NGINX_SITE"
              sudo -n nginx -t
              sudo -n systemctl reload nginx
              rm -f "$backup"
            }
            trap rollback ERR

            sudo -n install -m 644 "$CANDIDATE" "$NGINX_SITE"
            sudo -n rm -f "$NGINX_ENABLED"
            sudo -n ln -s "$NGINX_SITE" "$NGINX_ENABLED"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            sleep 2

            curl -kfsS --max-time 10 --resolve "$HOST:443:127.0.0.1" "https://$HOST/api/version" >/dev/null
            entry="$(grep -oE '/assets/[^\" ]+\.js' "$APP_DIR/dist/public/index.html" | head -n 1)"
            test -n "$entry"
            headers="$(curl -kfsSI --max-time 10 --resolve "$HOST:443:127.0.0.1" "https://$HOST$entry")"
            printf '%s\n' "$headers"
            printf '%s\n' "$headers" | grep -qi '^cache-control:.*immutable'

            trap - ERR
            rm -f "$backup" "$CANDIDATE"
            echo 'Nginx生产入口已恢复：应用转发到3000，静态资源可直出或安全回退。'
          ENDSSH
