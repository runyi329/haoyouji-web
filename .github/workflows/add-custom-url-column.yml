name: 添加custom_url字段到site_versions表
on:
  workflow_dispatch:
jobs:
  migrate:
    name: ALTER TABLE site_versions ADD COLUMN custom_url
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 在生产数据库执行ALTER TABLE
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e \"SET @exist := (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='site_versions' AND COLUMN_NAME='custom_url'); SET @sql := IF(@exist=0, 'ALTER TABLE site_versions ADD COLUMN custom_url VARCHAR(500) DEFAULT NULL AFTER landing_path', 'SELECT 1'); PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;\" && echo 'ALTER TABLE OK'"
