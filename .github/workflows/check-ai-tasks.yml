name: 排查AI分身定时任务
on:
  push:
    branches:
      - check-ai-tasks
jobs:
  check:
    name: 查询活跃AI分身任务
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查询用户名
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH' > /tmp/ai_tasks_result.txt 2>&1
            echo "===== user_id 870413 和 4957245 对应的用户信息 ====="
            mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db -e "
              SELECT id, username, name, phone, email, role
              FROM users
              WHERE id IN (870413, 4957245);
            " 2>&1
          ENDSSH
          cat /tmp/ai_tasks_result.txt
      - name: 上传查询结果
        uses: actions/upload-artifact@v4
        with:
          name: ai-tasks-report
          path: /tmp/ai_tasks_result.txt
          retention-days: 1
