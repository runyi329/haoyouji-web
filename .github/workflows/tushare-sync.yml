name: Tushare 数据同步（服务器本地运行）

on:
  workflow_dispatch:
    inputs:
      task:
        description: '同步任务类型'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - daily_basic
          - all

jobs:
  sync:
    name: 在服务器上运行 Tushare 同步
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 最长12小时

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔑 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 上传同步脚本到服务器
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_PORT }} \
            scripts/tushare/sync_daily.py \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/sync_daily.py

      - name: 🚀 在服务器上安装依赖并运行同步
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=720 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "=== 检查 Python 环境 ==="
            python3 --version

            echo "=== 安装依赖 ==="
            pip3 install tushare pymysql pandas --quiet --break-system-packages 2>&1 | tail -5 || \
            pip3 install tushare pymysql pandas --quiet 2>&1 | tail -5 || \
            python3 -m pip install tushare pymysql pandas --quiet --break-system-packages 2>&1 | tail -5

            echo "=== 开始同步（task=${{ github.event.inputs.task }}）==="
            cd /root
            nohup python3 /root/sync_daily.py --task ${{ github.event.inputs.task }} > /root/tushare_sync_stdout.log 2>&1 &
            SYNC_PID=$!
            echo "同步进程 PID: $SYNC_PID"

            # 等待同步完成，每30秒输出一次进度
            while kill -0 $SYNC_PID 2>/dev/null; do
              sleep 30
              echo "--- $(date '+%H:%M:%S') 进度 ---"
              tail -3 /root/tushare_sync.log 2>/dev/null || echo "日志尚未生成"
            done

            echo "=== 同步完成，最终日志 ==="
            tail -20 /root/tushare_sync.log
          ENDSSH
