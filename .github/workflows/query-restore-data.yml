name: 查询并恢复5月27日误删账目
on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型: query=仅查询, restore=查询并恢复'
        required: true
        default: 'query'
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: SSH执行
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            pip3 install pymysql -q 2>/dev/null || true
            ACTION="${{ github.event.inputs.action }}"
            python3 - "$ACTION" << 'PYEOF'
import re, pymysql, sys

action = sys.argv[1] if len(sys.argv) > 1 else 'query'
raw = open('/root/haoyouji-web/.env').read()
m = re.search(r'DATABASE_URL="?([^"\n]+)"?', raw)
url = m.group(1)
m2 = re.match(r'mysql://([^:]+):([^@]+)@([^:/]+):?([0-9]*)/([^?]+)', url)
user, pwd, host, port, db = m2.groups()
conn = pymysql.connect(host=host, port=int(port or 4000), user=user, password=pwd, database=db, ssl={'ssl': True}, charset='utf8mb4')

with conn.cursor() as cur:
    # 1. 查37号账本今天被删除的所有分类ID及名称
    cur.execute("""
        SELECT DISTINCT r.category_id, c.name as cat_name, COUNT(*) as cnt
        FROM ledger_records r
        LEFT JOIN ledger_categories c ON c.id = r.category_id
        WHERE r.deleted_at IS NOT NULL
          AND r.deleted_at >= NOW() - INTERVAL 12 HOUR
          AND r.ledger_id = 37
        GROUP BY r.category_id, c.name
        ORDER BY r.category_id
    """)
    cats37 = cur.fetchall()
    print("=== 37号账本今天被删除的分类 ===")
    for r in cats37:
        print(f"  category_id={r[0]} name={r[1]} 涉及{r[2]}条账目")

    # 2. 找「购物」分类ID（排除lomg）
    shopping_cat_ids = []
    for r in cats37:
        cat_name = (r[1] or '').strip().lower()
        if 'lomg' not in cat_name and r[0] is not None:
            shopping_cat_ids.append(r[0])
    
    print(f"\n=== 需要恢复的分类ID（排除lomg）: {shopping_cat_ids} ===")

    if not shopping_cat_ids:
        print("未找到需要恢复的分类，退出")
    else:
        cat_ids_str = ','.join(str(i) for i in shopping_cat_ids)
        
        # 3. 预览：其他账本中被误删的账目
        cur.execute(f"""
            SELECT r.ledger_id, l.name as ledger_name, COUNT(*) as cnt
            FROM ledger_records r
            LEFT JOIN ledgers l ON l.id = r.ledger_id
            WHERE r.deleted_at IS NOT NULL
              AND r.deleted_at >= NOW() - INTERVAL 12 HOUR
              AND r.ledger_id != 37
              AND r.category_id IN ({cat_ids_str})
            GROUP BY r.ledger_id, l.name
            ORDER BY r.ledger_id
        """)
        preview = cur.fetchall()
        total = sum(r[2] for r in preview)
        print(f"\n=== 其他账本被误删账目（共{len(preview)}个账本，{total}条）===")
        for r in preview:
            print(f"  账本{r[0]}({r[1]}): {r[2]}条")

        if action == 'restore':
            # 4. 执行恢复
            cur.execute(f"""
                UPDATE ledger_records
                SET deleted_at = NULL, deleted_by = NULL
                WHERE deleted_at IS NOT NULL
                  AND deleted_at >= NOW() - INTERVAL 12 HOUR
                  AND ledger_id != 37
                  AND category_id IN ({cat_ids_str})
            """)
            conn.commit()
            print(f"\n✅ 恢复完成！共恢复 {cur.rowcount} 条被误删账目")
        else:
            print(f"\n📋 仅查询模式。如需恢复，请将 action 改为 restore 重新触发")

conn.close()
PYEOF
