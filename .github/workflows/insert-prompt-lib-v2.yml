name: 写入口腔诊所AI客服拟人化公共指令库
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '写入拟人化公共指令库'
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: run insert script on server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "python3 /root/haoyouji-web/scripts/insert_prompt_lib.py \"\$(grep '^DATABASE_URL=' /root/haoyouji-web/.env | head -1 | cut -d'=' -f2- | tr -d '\"')\""
