name: 写入口腔诊所AI客服拟人化公共指令库
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '写入拟人化公共指令库'
jobs:
  insert:
    runs-on: self-hosted
    steps:
      - name: Insert prompt lib to DB
        run: |
          ENV_FILE="/root/haoyouji-web/.env"
          DATABASE_URL=$(grep "^DATABASE_URL=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '"' || echo "")
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL=$(grep "^ORIGINAL_DATABASE_URL=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '"' || echo "")
          fi
          echo "DATABASE_URL已获取: ${DATABASE_URL:0:40}..."
          python3 /root/haoyouji-web/scripts/insert_prompt_lib.py "$DATABASE_URL"
