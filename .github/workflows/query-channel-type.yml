name: query-channel-type
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 添加评分字段并验证
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          mysql -h 127.0.0.1 -u root -pMiao@20190603 crm_db << 'EOF'
          SET @col_exists = (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='wecom_message_credits' AND COLUMN_NAME='dialog_score');
          SET @sql = IF(@col_exists=0, 'ALTER TABLE wecom_message_credits ADD COLUMN dialog_score TINYINT DEFAULT NULL', 'SELECT "dialog_score already exists"');
          PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SET @col_exists = (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='wecom_message_credits' AND COLUMN_NAME='score_level');
          SET @sql = IF(@col_exists=0, 'ALTER TABLE wecom_message_credits ADD COLUMN score_level VARCHAR(10) DEFAULT NULL', 'SELECT "score_level already exists"');
          PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SET @col_exists = (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='wecom_message_credits' AND COLUMN_NAME='score_reason');
          SET @sql = IF(@col_exists=0, 'ALTER TABLE wecom_message_credits ADD COLUMN score_reason TEXT DEFAULT NULL', 'SELECT "score_reason already exists"');
          PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SET @col_exists = (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='wecom_message_credits' AND COLUMN_NAME='score_dimensions');
          SET @sql = IF(@col_exists=0, 'ALTER TABLE wecom_message_credits ADD COLUMN score_dimensions JSON DEFAULT NULL', 'SELECT "score_dimensions already exists"');
          PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SET @col_exists = (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='crm_db' AND TABLE_NAME='wecom_message_credits' AND COLUMN_NAME='score_at');
          SET @sql = IF(@col_exists=0, 'ALTER TABLE wecom_message_credits ADD COLUMN score_at TIMESTAMP DEFAULT NULL', 'SELECT "score_at already exists"');
          PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SELECT channel_type, COUNT(*) as cnt FROM wecom_message_credits GROUP BY channel_type;
          SHOW COLUMNS FROM wecom_message_credits WHERE Field IN ('dialog_score','score_level','score_reason','score_dimensions','score_at');
          EOF
          ENDSSH
