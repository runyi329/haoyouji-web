name: Upload wallet token icons to COS

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload verified token icons through deployment host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd /root/haoyouji-web
            node --input-type=module <<'EOF'
            import { createRequire } from 'module';
            import dotenv from 'dotenv';

            dotenv.config({ path: '/root/haoyouji-web/.env' });

            const secretId = process.env.COS_SECRET_ID;
            const secretKey = process.env.COS_SECRET_KEY;
            const bucket = process.env.COS_BUCKET || 'haoyouji-images-1396946788';
            const region = process.env.COS_REGION || 'ap-shanghai';
            if (!secretId || !secretKey) {
              throw new Error('COS credentials are not configured on the deployment host');
            }

            const require = createRequire(import.meta.url);
            const COS = require('cos-nodejs-sdk-v5');
            const cos = new COS({ SecretId: secretId, SecretKey: secretKey });
            const iconCodes = [
              'usdt', 'btc', 'eth', 'sol', 'bnb',
              'hype', 'trump', 'pengu', 'xpl', 'wlfi',
              'avax', 'doge', 'xlm', 'tia', 'eigen', 'fet', 'aave', 'sui',
              'ondo', 'aster', 'ldo', 'ena', 'arkm', 'sei', 'plume', 'ada',
              'zro', 'wld', 'link', 'pol', 'crv', 'pepe', 'b2',
            ];
            const sourceBase = 'https://static.coinall.ltd/cdn/oksupport/asset/currency/icon';
            const publicBase = `https://${bucket}.cos.${region}.myqcloud.com`;

            const sourceUrlFor = (code) => code === 'b2'
              ? 'https://bsquared.network/favicon.ico'
              : `${sourceBase}/${code}.png`;
            const keyFor = (code) => `assets/crypto-icons/${code}.${code === 'b2' ? 'ico' : 'png'}`;

            async function fetchIcon(code) {
              let lastError = null;
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const response = await fetch(sourceUrlFor(code), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (compatible; HaoyoujiWalletAsset/1.0)' },
                    signal: AbortSignal.timeout(45_000),
                  });
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                  return Buffer.from(await response.arrayBuffer());
                } catch (error) {
                  lastError = error;
                  if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, attempt * 2_000));
                }
              }
              throw new Error(`Unable to fetch ${code}: ${lastError instanceof Error ? lastError.message : String(lastError)}`);
            }

            for (const code of iconCodes) {
              const bytes = await fetchIcon(code);
              const key = keyFor(code);
              await new Promise((resolve, reject) => {
                cos.putObject({
                  Bucket: bucket,
                  Region: region,
                  Key: key,
                  Body: bytes,
                  ContentType: code === 'b2' ? 'image/x-icon' : 'image/png',
                  CacheControl: 'public, max-age=31536000, immutable',
                }, (error, result) => error ? reject(error) : resolve(result));
              });
              console.log(`Uploaded ${code}: ${publicBase}/${key}`);
            }
            EOF
