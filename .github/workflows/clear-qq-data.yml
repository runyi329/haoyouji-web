name: 清空QQ彩票数据表（一次性）
on:
  push:
    branches:
      - clear-qq-data
jobs:
  clear:
    name: 清空haoyouji库中的QQ数据表
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 在服务器上清空QQ数据表
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "开始清空QQ数据表..."
            mysql -h 127.0.0.1 -u root -pMiao@20190603 haoyouji -e "
              DELETE FROM qq_trade_records;
              SELECT ROW_COUNT() as qq_trade_records_deleted;
              DELETE FROM qq_online_records;
              SELECT ROW_COUNT() as qq_online_records_deleted;
              DELETE FROM qq_risk_alerts;
              SELECT ROW_COUNT() as qq_risk_alerts_deleted;
              DELETE FROM qq_ai_analysis_cache;
              SELECT ROW_COUNT() as qq_ai_analysis_cache_deleted;
              DELETE FROM qq_bet_odds;
              SELECT ROW_COUNT() as qq_bet_odds_deleted;
            " 2>&1 || echo "部分表可能不存在，已跳过"
            echo "清空完成！"
          ENDSSH
