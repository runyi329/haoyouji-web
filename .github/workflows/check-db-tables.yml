name: 检查数据库表状态

on:
  push:
    paths:
      - '.github/workflows/check-db-tables.yml'

jobs:
  check-tables:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 ts_ 开头的所有表及行数
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mysql -u root -p'Miao@20190603' haoyouji -e "
              SELECT table_name, table_rows
              FROM information_schema.tables
              WHERE table_schema = 'haoyouji'
              ORDER BY table_name;
            "
