name: bg-deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'backups/**'    # 子项目代码备份，不触发部署。其他文件（包括 rulesData.tsx）修改仍会触发部署。
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ServerAliveInterval 15\n  ServerAliveCountMax 10\n  ConnectTimeout 20\n  ConnectionAttempts 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: upload and configure
        run: |
          # SSH 连接重试函数
          ssh_retry() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "$@"; then
                return 0
              fi
              echo "SSH attempt $attempt/$max_attempts failed, retrying in 10s..."
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "SSH failed after $max_attempts attempts"
            return 1
          }

          scp_retry() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if scp -i ~/.ssh/id_rsa -P ${{ secrets.DEPLOY_PORT }} "$@"; then
                return 0
              fi
              echo "SCP attempt $attempt/$max_attempts failed, retrying in 10s..."
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "SCP failed after $max_attempts attempts"
            return 1
          }

          # 生成部署脚本
          cat > /tmp/deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          LOG=/tmp/haoyouji-deploy.log
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY START ===" > $LOG
          cd /root/haoyouji-web || { echo "cd failed" >> $LOG; exit 1; }
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] git fetch..." >> $LOG
          # 优先用 gh-proxy.com 镜像加速，避免国内服务器直连 GitHub 超时卡顿
          PROXY_URL="https://gh-proxy.com/https://github.com/runyi329/haoyouji-web.git"
          DIRECT_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/runyi329/haoyouji-web.git"
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 尝试镜像拉取..." >> $LOG
          if timeout 30 git fetch "$PROXY_URL" main:refs/remotes/origin/main >> $LOG 2>&1; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 镜像拉取成功" >> $LOG
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 镜像失败，回退直连 GitHub..." >> $LOG
            timeout 60 git fetch origin >> $LOG 2>&1 || echo "[$(date '+%Y-%m-%d %H:%M:%S')] 直连也失败，用本地缓存继续" >> $LOG
          fi
          git reset --hard origin/main >> $LOG 2>&1
          git clean -fd >> $LOG 2>&1
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pnpm install..." >> $LOG
          rm -rf node_modules/.vite client/.vite
          pnpm install --frozen-lockfile >> $LOG 2>&1
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pnpm build..." >> $LOG
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build >> $LOG 2>&1
          if [ ! -f dist/public/index.html ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] BUILD FAILED: dist/public/index.html not found, aborting deploy" >> $LOG
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY DONE (FAILED) ===" >> $LOG
            exit 1
          fi
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] sync to ubuntu user..." >> $LOG
          cp -r dist/. /home/ubuntu/haoyouji-web/dist/ >> $LOG 2>&1
          cp package.json /home/ubuntu/haoyouji-web/ >> $LOG 2>&1
          chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist >> $LOG 2>&1
          rsync -a --delete node_modules/ /home/ubuntu/haoyouji-web/node_modules/ >> $LOG 2>&1
          chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules >> $LOG 2>&1
          cp .env /home/ubuntu/haoyouji-web/.env 2>/dev/null && chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env >> $LOG 2>&1 || true
          sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs
          chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pm2 restart..." >> $LOG
          pm2 restart haoyouji-web --update-env >> $LOG 2>&1 || \
            pm2 start /root/haoyouji-web/ecosystem.config.cjs >> $LOG 2>&1 || true
          pm2 save >> $LOG 2>&1 || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pm2 status:" >> $LOG
          pm2 list >> $LOG 2>&1 || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY DONE ===" >> $LOG
          SCRIPTEOF
          chmod +x /tmp/deploy.sh

          # 上传部署脚本（带重试）
          scp_retry /tmp/deploy.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/haoyouji-deploy.sh

          # 一次性批量写入所有环境变量 + Nginx 配置（合并为单次 SSH，减少握手开销）
          ssh_retry << 'ENVSSH'
          cd /root/haoyouji-web
          # 环境变量批量更新函数
          upsert_env() {
            local key="$1" val="$2" file="/root/haoyouji-web/.env"
            if grep -q "^${key}=" "$file" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$file"
            else
              echo "${key}=${val}" >> "$file"
            fi
          }
          upsert_env "WECOM_DEEPSEEK_API_KEY" "\"${{ secrets.WECOM_DEEPSEEK_API_KEY }}\""
          upsert_env "HUNYUAN_API_KEY" "\"sk-OAOVyNdZqmZsybgDDcU3FtgB56HWxgJxdhxUbSNsfgZKdbHb\""
          upsert_env "BUILT_IN_FORGE_API_URL" "\"https://api.manus.im/api/llm-proxy/v1\""
          upsert_env "BUILT_IN_FORGE_API_KEY" "\"sk-UYkiAKe6Pn6SWtsWt5r3qV\""
          upsert_env "COS_SECRET_ID" "${{ secrets.COS_SECRET_ID }}"
          upsert_env "COS_SECRET_KEY" "${{ secrets.COS_SECRET_KEY }}"
          upsert_env "COS_BUCKET" "haoyouji-images-1396946788"
          upsert_env "COS_REGION" "ap-shanghai"
          # Nginx client_max_body_size
          NGINX_CONF=$(grep -rl "server_name" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1)
          [ -z "$NGINX_CONF" ] && NGINX_CONF=$(grep -rl "server_name" /etc/nginx/ 2>/dev/null | grep -v "nginx.conf" | head -1)
          if [ -n "$NGINX_CONF" ]; then
            if grep -q "client_max_body_size" "$NGINX_CONF"; then
              sed -i "s|client_max_body_size.*|client_max_body_size 50m;|g" "$NGINX_CONF"
            else
              sed -i "/server[[:space:]]*{/a\\    client_max_body_size 50m;" "$NGINX_CONF"
            fi
            nginx -t && nginx -s reload && echo "Nginx reloaded" || echo "Nginx reload failed"
          fi
          echo "Environment configured"
          ENVSSH
          echo "Upload and configure done"

      - name: start background deploy
        run: |
          # SSH 连接重试
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'chmod +x /tmp/haoyouji-deploy.sh && nohup /tmp/haoyouji-deploy.sh </dev/null >/dev/null 2>/dev/null & disown; echo "started pid=$!"'; then
              echo "Deploy script started"
              break
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: wait for deploy
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 24); do
            sleep 15
            RESULT=$(ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'tail -3 /tmp/haoyouji-deploy.log 2>/dev/null || echo "log not ready"' 2>/dev/null || echo "ssh-fail")
            echo "[$i/24] $RESULT"
            if echo "$RESULT" | grep -q "DEPLOY DONE"; then
              echo "Deploy completed!"
              exit 0
            fi
            if echo "$RESULT" | grep -q "ssh-fail"; then
              echo "SSH check failed, will retry..."
            fi
          done
          echo "=== Full deploy log ==="
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cat /tmp/haoyouji-deploy.log' 2>/dev/null || true
          echo "Deploy may still be running in background"
