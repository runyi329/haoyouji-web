name: bg-deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ServerAliveInterval 20\n  ServerAliveCountMax 20\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: upload deploy script
        run: |
          cat > /tmp/deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          LOG=/tmp/haoyouji-deploy.log
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY START ===" > $LOG
          cd /root/haoyouji-web || { echo "cd failed" >> $LOG; exit 1; }
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] git fetch..." >> $LOG
          git fetch origin >> $LOG 2>&1
          git reset --hard origin/main >> $LOG 2>&1
          git clean -fd >> $LOG 2>&1
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pnpm install..." >> $LOG
          rm -rf node_modules/.vite client/.vite
          pnpm install --frozen-lockfile >> $LOG 2>&1
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pnpm build..." >> $LOG
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build >> $LOG 2>&1
          if [ ! -f dist/public/index.html ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] BUILD FAILED: dist/public/index.html not found, aborting deploy" >> $LOG
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY DONE (FAILED) ===" >> $LOG
            exit 1
          fi
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] sync to ubuntu user..." >> $LOG
          cp -r dist/. /home/ubuntu/haoyouji-web/dist/ >> $LOG 2>&1
          cp package.json /home/ubuntu/haoyouji-web/ >> $LOG 2>&1
          chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist >> $LOG 2>&1
          rsync -a --delete node_modules/ /home/ubuntu/haoyouji-web/node_modules/ >> $LOG 2>&1
          chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules >> $LOG 2>&1
          cp .env /home/ubuntu/haoyouji-web/.env 2>/dev/null && chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env >> $LOG 2>&1 || true
          sed 's|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g' ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs
          chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pm2 restart..." >> $LOG
          # 先尝试重启 ubuntu 用户的 haoyouji-web 进程
          sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 restart /home/ubuntu/haoyouji-web/ecosystem.config.cjs --update-env' >> $LOG 2>&1 || \
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs' >> $LOG 2>&1 || \
            pm2 restart haoyouji-web >> $LOG 2>&1 || \
            pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs >> $LOG 2>&1 || true
          sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 save' >> $LOG 2>&1 || pm2 save >> $LOG 2>&1 || true
          # 同时重启 root 用户的 openclaw-gateway 进程（如果存在）
          pm2 restart openclaw-gateway >> $LOG 2>&1 || pm2 restart all >> $LOG 2>&1 || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] pm2 status:" >> $LOG
          pm2 list >> $LOG 2>&1 || true
          sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 list' >> $LOG 2>&1 || true
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] === DEPLOY DONE ===" >> $LOG
          SCRIPTEOF
          chmod +x /tmp/deploy.sh
          scp -i ~/.ssh/id_rsa -P ${{ secrets.DEPLOY_PORT }} /tmp/deploy.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/haoyouji-deploy.sh
          # 将 WECOM_DEEPSEEK_API_KEY 写入服务器 .env（如已存在则更新，否则新增）
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'grep -q "WECOM_DEEPSEEK_API_KEY" /root/haoyouji-web/.env && sed -i "s|WECOM_DEEPSEEK_API_KEY=.*|WECOM_DEEPSEEK_API_KEY=\"${{ secrets.WECOM_DEEPSEEK_API_KEY }}\"|" /root/haoyouji-web/.env || echo "WECOM_DEEPSEEK_API_KEY=\"${{ secrets.WECOM_DEEPSEEK_API_KEY }}\"" >> /root/haoyouji-web/.env'
          # 将 HUNYUAN_API_KEY（腾讯混元 embedding）写入服务器 .env（存在则更新，否则新增）
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'grep -q "HUNYUAN_API_KEY" /root/haoyouji-web/.env && sed -i "s|HUNYUAN_API_KEY=.*|HUNYUAN_API_KEY=\"sk-OAOVyNdZqmZsybgDDcU3FtgB56HWxgJxdhxUbSNsfgZKdbHb\"|" /root/haoyouji-web/.env || echo "HUNYUAN_API_KEY=\"sk-OAOVyNdZqmZsybgDDcU3FtgB56HWxgJxdhxUbSNsfgZKdbHb\"" >> /root/haoyouji-web/.env'
          # 将 BUILT_IN_FORGE_API_URL 写入服务器 .env（Manus forgeApi 地址，用于语音识别/Whisper）
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'grep -q "BUILT_IN_FORGE_API_URL" /root/haoyouji-web/.env && sed -i "s|BUILT_IN_FORGE_API_URL=.*|BUILT_IN_FORGE_API_URL=\"https://api.manus.im/api/llm-proxy/v1\"|" /root/haoyouji-web/.env || echo "BUILT_IN_FORGE_API_URL=\"https://api.manus.im/api/llm-proxy/v1\"" >> /root/haoyouji-web/.env'
          # 将 BUILT_IN_FORGE_API_KEY 写入服务器 .env（Manus forgeApi key，用于语音识别/Whisper）
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'grep -q "BUILT_IN_FORGE_API_KEY" /root/haoyouji-web/.env && sed -i "s|BUILT_IN_FORGE_API_KEY=.*|BUILT_IN_FORGE_API_KEY=\"sk-UYkiAKe6Pn6SWtsWt5r3qV\"|" /root/haoyouji-web/.env || echo "BUILT_IN_FORGE_API_KEY=\"sk-UYkiAKe6Pn6SWtsWt5r3qV\"" >> /root/haoyouji-web/.env'
          echo "Script uploaded and env updated"

      - name: start background deploy
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'chmod +x /tmp/haoyouji-deploy.sh && nohup /tmp/haoyouji-deploy.sh </dev/null >/dev/null 2>/dev/null & disown; echo "started pid=$!"'

      - name: wait for deploy
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              'tail -3 /tmp/haoyouji-deploy.log 2>/dev/null || echo "log not ready"' 2>/dev/null || echo "ssh-fail")
            echo "[$i/20] $RESULT"
            if echo "$RESULT" | grep -q "DEPLOY DONE"; then
              echo "Deploy completed!"
              exit 0
            fi
          done
          echo "=== Full deploy log ==="
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cat /tmp/haoyouji-deploy.log' 2>/dev/null || true
          echo "Deploy may still be running in background"
