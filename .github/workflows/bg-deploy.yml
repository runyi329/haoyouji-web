name: bg-deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host *" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "  ServerAliveInterval 20" >> ~/.ssh/config
          echo "  ServerAliveCountMax 20" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: run deploy in background
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'export PATH="/root/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"; nohup bash -c "cd /root/haoyouji-web && git fetch origin && git reset --hard origin/main && git clean -fd && rm -rf node_modules/.vite client/.vite && pnpm install && pnpm run build && cp -r dist/. /home/ubuntu/haoyouji-web/dist/ && cp package.json /home/ubuntu/haoyouji-web/ && chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/dist && rsync -a --delete node_modules/ /home/ubuntu/haoyouji-web/node_modules/ && chown -R ubuntu:ubuntu /home/ubuntu/haoyouji-web/node_modules && cp .env /home/ubuntu/haoyouji-web/.env 2>/dev/null; chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/.env 2>/dev/null; sed s|/root/haoyouji-web|/home/ubuntu/haoyouji-web|g ecosystem.config.cjs > /home/ubuntu/haoyouji-web/ecosystem.config.cjs && chown ubuntu:ubuntu /home/ubuntu/haoyouji-web/ecosystem.config.cjs && sudo -u ubuntu bash -c '"'"'HOME=/home/ubuntu pm2 restart /home/ubuntu/haoyouji-web/ecosystem.config.cjs --update-env || HOME=/home/ubuntu pm2 start /home/ubuntu/haoyouji-web/ecosystem.config.cjs'"'"' && sudo -u ubuntu bash -c '"'"'HOME=/home/ubuntu pm2 save'"'"' && echo DEPLOY_DONE" > /tmp/deploy-bg.log 2>&1 &'
          echo "Background deploy started, PID logged"

      - name: wait for deploy
        run: |
          for i in $(seq 1 16); do
            sleep 30
            RESULT=$(ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'tail -1 /tmp/deploy-bg.log 2>/dev/null || echo waiting' 2>/dev/null || echo "ssh-fail")
            echo "[$i/16] $RESULT"
            if echo "$RESULT" | grep -q "DEPLOY_DONE"; then
              echo "Deploy completed successfully!"
              exit 0
            fi
          done
          echo "=== Final log ==="
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cat /tmp/deploy-bg.log' 2>/dev/null || true
