name: zz-check-sms-config
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Send test SMS to 13127919173
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            source /root/haoyouji-web/.env 2>/dev/null || true
            echo "=== 短信配置 ==="
            echo "APP_ID: ${TENCENT_SMS_APP_ID:0:4}***"
            echo "SIGN_NAME: $TENCENT_SMS_SIGN_NAME"
            echo "TEMPLATE_ID: $TENCENT_SMS_TEMPLATE_ID"
            echo "REGION: $TENCENT_SMS_REGION"
            echo ""
            echo "=== 发送测试短信到 13127919173 ==="
            node -e "
const tencentcloud = require('/root/haoyouji-web/node_modules/tencentcloud-sdk-nodejs');
const SmsClient = tencentcloud.sms.v20210111.Client;
const client = new SmsClient({
  credential: {
    secretId: process.env.COS_SECRET_ID,
    secretKey: process.env.COS_SECRET_KEY,
  },
  region: process.env.TENCENT_SMS_REGION || 'ap-guangzhou',
  profile: { httpProfile: { endpoint: 'sms.tencentcloudapi.com' } },
});
const params = {
  SmsSdkAppId: process.env.TENCENT_SMS_APP_ID,
  SignName: process.env.TENCENT_SMS_SIGN_NAME,
  TemplateId: process.env.TENCENT_SMS_TEMPLATE_ID,
  PhoneNumberSet: ['+8613127919173'],
  TemplateParamSet: ['888888', '5'],
};
console.log('发送中...');
client.SendSms(params).then(res => {
  const r = res.SendStatusSet[0];
  if (r.Code === 'Ok') {
    console.log('✅ 短信发送成功！SerialNo:', r.SerialNo);
  } else {
    console.log('❌ 发送失败:', r.Code, r.Message);
  }
}).catch(err => {
  console.error('❌ 异常:', err.code, err.message);
});
" 2>&1
          ENDSSH
