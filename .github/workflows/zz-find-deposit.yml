name: zz-find-deposit
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: find deposit record
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mysql -u root -pMiao@20190603 crm_db 2>/dev/null <<'SQL'

            -- 1. 列出所有与 ledger/account/钱脉 相关的表
            SELECT TABLE_NAME FROM information_schema.TABLES
            WHERE TABLE_SCHEMA='crm_db'
              AND (TABLE_NAME LIKE '%ledger%'
                OR TABLE_NAME LIKE '%account%'
                OR TABLE_NAME LIKE '%wallet%'
                OR TABLE_NAME LIKE '%fund%');

            -- 2. 全库搜索含"三郎"的记录（所有表的 name/remark/note/alias 列）
            SELECT '三郎搜索-users' AS src, id, name, username FROM users WHERE name LIKE '%三郎%' OR username LIKE '%三郎%';
            SELECT '三郎搜索-ledger_members' AS src, id, ledgerId, userId, role FROM ledger_members WHERE role LIKE '%三郎%';

            -- 3. 查 ledger_backup_settings 表结构（可能存保证金设置）
            DESCRIBE ledger_backup_settings;

            -- 4. 查账本37相关的 ledger_backup_settings 数据
            SELECT * FROM ledger_backup_settings WHERE ledgerId = 37 OR ledger_id = 37 LIMIT 20;

            SQL
