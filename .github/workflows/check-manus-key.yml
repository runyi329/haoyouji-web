name: Check Manus API Key
on:
  workflow_dispatch:
    inputs:
      dummy:
        description: '触发检查'
        required: false
        default: 'run'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 设置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: 检查MANUS_API_KEY
        run: |
          ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no root@124.223.54.69 << 'ENDSSH'
            echo "=== /root/haoyouji-web/.env MANUS相关配置 ==="
            grep -i "manus\|MANUS" /root/haoyouji-web/.env 2>/dev/null || echo "未找到MANUS配置"
            echo ""
            echo "=== PM2环境变量中的MANUS_API_KEY ==="
            pm2 env 0 2>/dev/null | grep -i manus || echo "PM2 env中无MANUS"
            echo ""
            echo "=== 测试Manus API ==="
            MANUS_KEY=$(grep "MANUS_API_KEY" /root/haoyouji-web/.env 2>/dev/null | cut -d'=' -f2- | tr -d '"' || echo "")
            if [ -n "$MANUS_KEY" ]; then
              echo "MANUS_KEY前20字符: ${MANUS_KEY:0:20}..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-manus-api-key: $MANUS_KEY" "https://api.manus.ai/v2/usage.list?limit=1")
              echo "API响应码: $HTTP_CODE"
            else
              echo "MANUS_API_KEY为空"
            fi
ENDSSH
