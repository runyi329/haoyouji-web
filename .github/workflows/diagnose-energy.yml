name: 诊断能源价格扫描器

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: 检查服务器日志和网络连通性
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔍 检查服务器状态
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== PM2进程状态 ==="
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 list' 2>&1

            echo ""
            echo "=== 最新PM2日志（最后50行）==="
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu pm2 logs haoyouji-web --nostream --lines 50' 2>&1

            echo ""
            echo "=== 测试Yahoo Finance连通性 ==="
            curl -s --max-time 10 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/CL=F?interval=1d&range=1d" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    meta = d['chart']['result'][0]['meta']
    print('WTI price:', meta.get('regularMarketPrice'))
    print('Yahoo Finance: 可访问')
except Exception as e:
    print('Yahoo Finance: 访问失败 -', str(e))
" 2>&1

            echo ""
            echo "=== energy_market_data最新数据 ==="
            # 检查数据库中最新的能源数据
            sudo -u ubuntu bash -c 'HOME=/home/ubuntu node -e "
const mysql = require(\"/home/ubuntu/haoyouji-web/node_modules/mysql2/promise\");
async function check() {
  const conn = await mysql.createConnection(process.env.DATABASE_URL || \"\");
  const [rows] = await conn.execute(\"SELECT symbol, last_price, updated_at FROM energy_market_data ORDER BY id DESC LIMIT 6\");
  console.log(JSON.stringify(rows, null, 2));
  await conn.end();
}
check().catch(e => console.error(e.message));
"' 2>&1 || echo "数据库查询失败"
          ENDSSH
