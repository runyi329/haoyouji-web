name: MySQL Grant External Access (One-time)

on:
  push:
    paths:
      - '.github/workflows/mysql-grant-external.yml'

jobs:
  grant-mysql-access:
    runs-on: ubuntu-latest
    steps:
      - name: Grant MySQL external access via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.223.54.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== 检查 MySQL bind-address ==="
            mysql -u root -pMiao@20190603 -e "SHOW VARIABLES LIKE 'bind_address';" 2>/dev/null
            
            echo "=== 授权 root 用户从任意 IP 连接 ==="
            mysql -u root -pMiao@20190603 -e "
              CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'Miao@20190603';
              GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
              FLUSH PRIVILEGES;
            " 2>/dev/null && echo "授权成功" || echo "授权失败"
            
            echo "=== 检查 MySQL 监听端口 ==="
            netstat -tlnp 2>/dev/null | grep 3306 || ss -tlnp | grep 3306
            
            echo "=== 查找并修改 MySQL 配置文件 bind-address ==="
            # 查找所有可能的配置文件
            for f in /etc/mysql/mysql.conf.d/mysqld.cnf /etc/mysql/my.cnf /etc/my.cnf /etc/mysql/conf.d/*.cnf; do
              if [ -f "$f" ]; then
                echo "检查文件: $f"
                cat "$f" | grep -i bind
              fi
            done
            
            # 强制修改 bind-address
            CONF_FILE=""
            if [ -f /etc/mysql/mysql.conf.d/mysqld.cnf ]; then
              CONF_FILE=/etc/mysql/mysql.conf.d/mysqld.cnf
            elif [ -f /etc/mysql/my.cnf ]; then
              CONF_FILE=/etc/mysql/my.cnf
            elif [ -f /etc/my.cnf ]; then
              CONF_FILE=/etc/my.cnf
            fi
            
            if [ -n "$CONF_FILE" ]; then
              echo "修改配置文件: $CONF_FILE"
              # 修改 bind-address
              sed -i 's/^bind-address\s*=.*/bind-address = 0.0.0.0/' "$CONF_FILE"
              # 如果没有 bind-address 行，在 [mysqld] 下添加
              if ! grep -q "bind-address" "$CONF_FILE"; then
                sed -i '/\[mysqld\]/a bind-address = 0.0.0.0' "$CONF_FILE"
              fi
              echo "修改后的 bind-address 配置:"
              grep -i bind "$CONF_FILE"
              
              echo "重启 MySQL..."
              systemctl restart mysql && echo "MySQL 重启成功" || service mysql restart && echo "MySQL 重启成功"
            else
              echo "未找到 MySQL 配置文件，尝试直接重启"
            fi
            
            echo "=== 重启后检查监听端口 ==="
            sleep 3
            netstat -tlnp 2>/dev/null | grep 3306 || ss -tlnp | grep 3306
            
            echo "=== 完成 ==="
