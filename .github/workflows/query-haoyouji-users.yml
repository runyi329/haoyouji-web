name: 查询好友记本地数据库用户
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 发送云亭模拟预警邮件
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            echo "=== 查询funder_asset_orders表结构 ==="
            mysql -u root -pMiao@20190603 crm_db -e "DESCRIBE funder_asset_orders;" 2>/dev/null

            echo "=== 查询Yunting(id=540801)的订单 ==="
            mysql -u root -pMiao@20190603 crm_db -e "SELECT * FROM funder_asset_orders WHERE user_id=540801 LIMIT 3;" 2>/dev/null

            echo "=== 发送预警邮件 ==="
            cd /root/haoyouji-web
            node --input-type=module << 'NODEOF'
import { createTransport } from './node_modules/nodemailer/lib/nodemailer.js';
import { createConnection } from './node_modules/mysql2/promise.js';

const conn = await createConnection({ host:'127.0.0.1', port:3306, user:'root', password:'Miao@20190603', database:'crm_db' });

// 查询Yunting的订单
const [orders] = await conn.execute("SELECT * FROM funder_asset_orders WHERE user_id=540801 LIMIT 1");
const order = orders[0];
console.log('订单信息:', JSON.stringify(order));

// 查询表字段名
const [cols] = await conn.execute("SHOW COLUMNS FROM funder_asset_orders");
console.log('字段列表:', cols.map(c => c.Field).join(', '));

await conn.end();

// 模拟数据
const userName = 'Yunting';
const toEmail = '1821113@qq.com';
const coin = order ? (order.coin || order.symbol || 'BTC') : 'BTC';
// 尝试各种可能的字段名
const rawVal = order ? (order.buy_amount || order.amount || order.total_value || order.value || order.principal || 100000) : 100000;
const buyValue = parseFloat(rawVal) || 100000;
const gapPct = 30;
const gapAmount = (buyValue * gapPct / 100).toFixed(2);
const collateralValue = (buyValue * 0.7).toFixed(2);
const accruedInterest = (buyValue * 0.05).toFixed(2);
const now = new Date();
const dateStr = now.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });

const transporter = createTransport({
  host: 'smtp.qq.com', port: 465, secure: true,
  auth: { user: 'tina_u@qq.com', pass: 'wqettalptfmebgdf' },
});

const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.c{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.h{background:linear-gradient(135deg,#1A56DB 0%,#3B82F6 100%);padding:28px 24px;text-align:center}
.h h1{color:#fff;font-size:20px;margin:0 0 6px;font-weight:600}
.h p{color:rgba(255,255,255,.85);font-size:13px;margin:0}
.b{padding:24px}
.g{font-size:15px;color:#1A2340;margin-bottom:16px}
.ac{background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:12px;padding:16px;margin-bottom:20px}
.at{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#C2410C;margin-bottom:12px}
.dot{width:8px;height:8px;background:#F97316;border-radius:50%}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #FDE8D0;font-size:13px}
.row:last-child{border-bottom:none}
.lbl{color:#6B7280}.val{font-weight:600;color:#1A2340}
.red{color:#EF4444}.orange{color:#F97316}
.tip{background:#F0F4FF;border-radius:10px;padding:14px 16px;font-size:13px;color:#374151;line-height:1.7;margin-bottom:20px}
.tip strong{color:#1A56DB}
.ft{text-align:center;padding:16px 24px;background:#F9FAFB;font-size:12px;color:#9CA3AF;border-top:1px solid #F3F4F6}
.badge{display:inline-block;background:#EFF6FF;color:#1A56DB;font-size:11px;padding:3px 10px;border-radius:20px;margin-top:4px}
</style></head>
<body><div class="c">
<div class="h"><h1>🔔 担保缺口提醒</h1><p>来自好友记 · AI 智能通知</p></div>
<div class="b">
<p class="g">您好，${userName}！</p>
<div class="ac">
  <div class="at"><div class="dot"></div>担保缺口已超过 30%</div>
  <div class="row"><span class="lbl">标的币种</span><span class="val">${coin}</span></div>
  <div class="row"><span class="lbl">买入价值</span><span class="val">${buyValue.toFixed(2)} U</span></div>
  <div class="row"><span class="lbl">担保物当前价值</span><span class="val">${collateralValue} U</span></div>
  <div class="row"><span class="lbl">待结利息</span><span class="val">${accruedInterest} U</span></div>
  <div class="row"><span class="lbl">担保缺口</span><span class="val red">-${gapAmount} U</span></div>
  <div class="row"><span class="lbl">缺口占比</span><span class="val orange">${gapPct}%</span></div>
</div>
<div class="tip"><strong>温馨提示：</strong>当前担保缺口已达买入价值的 ${gapPct}%，建议您尽快与对方沟通，协商补充担保物或安排付息，以保持良好的合作关系。<br><br>此提醒仅发送一次，缺口在同一区间内波动不重复通知。缺口完全恢复或进一步扩大时，将再次发送提醒。</div>
<div style="text-align:center"><div class="badge">提醒时间：${dateStr}</div></div>
</div>
<div class="ft">此邮件由好友记 AI 智能通知系统自动发送，请勿直接回复。<br>如需调整提醒设置，请在 App 内订单详情页操作。</div>
</div></body></html>`;

await transporter.sendMail({
  from: '"好友记 AI 通知" <tina_u@qq.com>',
  to: toEmail,
  subject: `【好友记】${coin} 订单担保缺口提醒（已超过 ${gapPct}%）`,
  html,
});
console.log('✅ 邮件已成功发送至', toEmail);
NODEOF
          ENDSSH
