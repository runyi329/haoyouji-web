name: zz-check-pm2-now
on:
  push:
    paths:
      - '.github/workflows/zz-check-pm2-now.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.223.54.69 >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Check PM2 and logs
        run: |
          ssh -o StrictHostKeyChecking=no root@124.223.54.69 << 'ENDSSH'
            echo "=== PM2 状态 ==="
            pm2 list 2>/dev/null
            echo ""
            echo "=== 服务器代码最新commit ==="
            cd /root/haoyouji-web && git log --oneline -3 2>/dev/null
            echo ""
            echo "=== PM2 最新50行日志 ==="
            pm2 logs --lines 50 --nostream 2>/dev/null | tail -50
ENDSSH
