name: zz-check-email-log
on:
  push:
    paths:
      - '.github/workflows/zz-check-email-log.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查看测试通知日志
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "tail -300 /home/ubuntu/.pm2/logs/haoyouji-web-out-0.log 2>/dev/null | grep -i '测试通知\|sendAlert\|SMTP\|email\|Error\|error\|trpc\|funder' | grep -v 'Scanner\|ETIMEDOUT\|BSC\|ERC20\|Solana\|能源价格\|prediction\|userRole\|ledger_members' | tail -30"
