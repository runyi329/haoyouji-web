# test email send directly
name: zz-check-email-log
on:
  push:
    paths:
      - '.github/workflows/zz-check-email-log.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 直接测试邮件发送
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/ubuntu/haoyouji-web && node -e \"
import('./dist/index.js').catch(e => {});
setTimeout(async () => {
  try {
    const m = await import('./dist/index.js');
    console.log('keys:', Object.keys(m).slice(0,5));
  } catch(e) { console.log('import error:', e.message); }
}, 2000);
\" 2>&1 | head -5 || echo 'node test failed'; echo '--- checking email env ---'; env | grep -i 'QQ\|SMTP\|EMAIL\|MAIL' || echo 'no email env vars'"
