# check email error log v2
name: zz-check-email-log
on:
  push:
    paths:
      - '.github/workflows/zz-check-email-log.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 查看邮件相关日志
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '=== OUT LOG ===' && tail -80 /home/ubuntu/.pm2/logs/haoyouji-web-out-0.log 2>/dev/null | grep -i 'sendAlert\|email\|smtp\|nodemailer\|funderSend\|Error\|error' | tail -20; echo '=== ERROR LOG ===' && tail -200 /home/ubuntu/.pm2/logs/haoyouji-web-error-0.log 2>/dev/null | grep -v 'Scanner\|ETIMEDOUT\|BSC\|ERC20\|Solana\|Missing session' | tail -30"
