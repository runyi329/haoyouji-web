# test smtp connection
name: zz-check-email-log
on:
  push:
    paths:
      - '.github/workflows/zz-check-email-log.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: 测试SMTP连接
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'SSHEOF'
          cd /home/ubuntu/haoyouji-web
          cat > /tmp/test-email.mjs << 'JSEOF'
import nodemailer from '/home/ubuntu/haoyouji-web/node_modules/nodemailer/lib/nodemailer.js';
const t = nodemailer.createTransport({
  host: 'smtp.qq.com', port: 465, secure: true,
  auth: { user: 'tina_u@qq.com', pass: 'wqettalptfmebgdf' }
});
try {
  await t.verify();
  console.log('SMTP OK');
  await t.sendMail({ from: '"测试" <tina_u@qq.com>', to: 'tina_u@qq.com', subject: '好友记测试', html: '<p>测试</p>' });
  console.log('SEND OK');
} catch(e) { console.log('ERROR:', e.message); }
JSEOF
          node /tmp/test-email.mjs 2>&1 || echo "node failed"
          SSHEOF
